<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1020">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="js/pwa.js" defer></script>
  <meta name="description" content="Game Zone by Shubham Goyal – free games jo mobile aur laptop dono par chalte hain.">
  <title>Game Zone by Shubham Goyal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">
      <img src="icons/icon-192.png" alt="" width="38" height="38">
      <span class="logo-text"><b>Game <span>Zone</span></b><small>by Shubham Goyal</small></span>
    </a>
    <label class="search">
      <span aria-hidden="true">🔍</span>
      <input type="search" id="search" placeholder="Game dhoondho..." autocomplete="off" aria-label="Game dhoondho">
      <kbd>/</kbd>
    </label>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="spot" id="spot"></div>
      <div class="hero-side">
        <div class="stats">
          <div><b id="statGames">0</b><span>Games</span></div>
          <div><b id="stat2p">0</b><span>2 Player</span></div>
          <div><b>100%</b><span>Offline</span></div>
        </div>
        <div class="get-app" id="getApp">
          <a class="app-btn apk" id="apkBtn" href="download/GameZone.apk" download hidden>⬇️ Android APK</a>
          <button class="app-btn install" id="installBtn" hidden>📲 App Install karo</button>
        </div>
        <p class="app-note" id="appNote">Free games · koi login nahi · bina internet ke bhi chalte hain</p>
      </div>
    </section>

    <nav class="tabs" id="tabs" aria-label="Categories">
      <button class="tab" data-filter="all">🎮 Saare <b></b></button>
      <button class="tab" data-filter="new">🆕 Naye <b></b></button>
      <button class="tab" data-filter="2p">👥 2 Player <b></b></button>
      <button class="tab" data-filter="action">🏃 Action <b></b></button>
      <button class="tab" data-filter="puzzle">🧠 Puzzle <b></b></button>
      <button class="tab" data-filter="classic">🎲 Classic <b></b></button>
      <button class="tab" data-filter="fav">❤️ Favourites <b></b></button>
    </nav>

    <div id="content"></div>
  </main>

  <footer class="site-footer">
    <img src="icons/icon-192.png" alt="" width="44" height="44">
    <div><b>Game Zone</b> by Shubham Goyal</div>
    <small>Mobile + Laptop · Bina internet ke · © 2026</small>
  </footer>

  <script src="js/games.js"></script>
  <script src="js/home.js"></script>
  <script>
    // App install / APK download buttons
    (() => {
      const inApp = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone || window.Capacitor;
      if (inApp) return; // app ke andar ho toh buttons ki zaroorat nahi
      const apk = document.getElementById("apkBtn");
      const install = document.getElementById("installBtn");
      const note = document.getElementById("appNote");
      const isAndroid = /android/i.test(navigator.userAgent);
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

      // APK file website par hai tabhi button dikhao
      if (location.protocol !== "file:") {
        fetch(apk.getAttribute("href"), { method: "HEAD" })
          .then((r) => { if (r.ok) { apk.hidden = false; if (isAndroid) note.textContent = "APK download karke kholo. 'Unknown apps' ki permission maange toh Allow karo."; } })
          .catch(() => {});
      }

      let prompt = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        prompt = e;
        install.hidden = false;
      });
      install.addEventListener("click", async () => {
        if (!prompt) return;
        prompt.prompt();
        await prompt.userChoice;
        prompt = null;
        install.hidden = true;
      });
      window.addEventListener("appinstalled", () => {
        install.hidden = true;
        note.textContent = "✅ App install ho gaya! Ab home screen se bina net ke khelo.";
      });
      if (isIOS) note.textContent = "📱 iPhone: Share ⬆️ → 'Add to Home Screen' — phir bina net ke chalega.";
    })();
  </script>
</body>
</html>
