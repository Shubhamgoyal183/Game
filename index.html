<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1020">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/site.js" defer></script>
  <meta name="description" content="Game Zone by Shubham Goyal – free games jo mobile aur laptop dono par chalte hain.">
  <title>Game Zone by Shubham Goyal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/account.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">
      <img src="icons/icon-192.png" alt="" width="38" height="38">
      <span class="logo-text"><b>Game <span>Zone</span></b><small>by Shubham Goyal</small></span>
    </a>
    <label class="search">
      <span aria-hidden="true">🔍</span>
      <input type="search" id="search" placeholder="Game dhoondho..." autocomplete="off" aria-label="Game dhoondho">
      <kbd>/</kbd>
    </label>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="spot" id="spot"></div>
      <div class="hero-side">
        <div class="stats">
          <div><b id="statGames">0</b><span>Games</span></div>
          <div><b id="stat2p">0</b><span>2 Player</span></div>
          <div><b>100%</b><span>Offline</span></div>
        </div>
        <div class="get-app" id="getApp">
          <a class="app-btn apk" id="apkBtn" href="download/GameZone.apk" download hidden>⬇️ Android App Download</a>
        </div>
        <p class="app-note" id="appNote">Free games · Android app · login karke progress save karo</p>
      </div>
    </section>

    <nav class="tabs" id="tabs" aria-label="Categories">
      <button class="tab" data-filter="all">🎮 Saare <b></b></button>
      <button class="tab" data-filter="new">🆕 Naye <b></b></button>
      <button class="tab" data-filter="2p">👥 2 Player <b></b></button>
      <button class="tab" data-filter="action">🏃 Action <b></b></button>
      <button class="tab" data-filter="puzzle">🧠 Puzzle <b></b></button>
      <button class="tab" data-filter="classic">🎲 Classic <b></b></button>
      <button class="tab" data-filter="fav">❤️ Favourites <b></b></button>
    </nav>

    <div id="content"></div>
  </main>

  <footer class="site-footer">
    <img src="icons/icon-192.png" alt="" width="44" height="44">
    <div><b>Game Zone</b> by Shubham Goyal</div>
    <small>Mobile + Laptop · Bina internet ke · © 2026</small>
  </footer>

  <script src="js/games.js"></script>
  <script src="js/home.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/vendor/firebase.js"></script>
  <script src="js/account.js"></script>
  <script>
    // Android APK download button (app ke andar chhupa do)
    (() => {
      if (window.Capacitor) return;
      const apk = document.getElementById("apkBtn");
      const note = document.getElementById("appNote");
      if (location.protocol === "file:") return;
      fetch(apk.getAttribute("href"), { method: "HEAD" })
        .then((r) => {
          if (!r.ok) return;
          apk.hidden = false;
          if (/android/i.test(navigator.userAgent)) note.textContent = "APK download karke kholo. 'Unknown apps' ki permission maange toh Allow karo.";
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
