<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1020">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../icons/favicon.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="../../js/pwa.js" defer></script>
  <title>Endless Runner – Game Zone</title>
  <link rel="stylesheet" href="../../css/game.css">
</head>
<body class="fullscreen">
  <header class="topbar">
    <a class="btn small" href="../../index.html">← Home</a>
    <h1>🏃 Endless Runner</h1>
    <span class="spacer"></span>
  </header>
  <main class="stage">
    <div class="canvas-wrap" id="wrap"><canvas id="game"></canvas></div>
    <div class="hint" id="hint">Space / ↑ = kudo (2 baar = double jump) · ↓ = slide</div>
  </main>

  <script src="../../js/common.js"></script>
  <script>
    (() => {
      const PX = 110;
      let H = 400, GROUND = 330;
      const GRAV = 2000, JUMP = -700, JUMP2 = -600;
      let W = 640;
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const wrap = document.getElementById("wrap");
      if (IS_TOUCH) document.getElementById("hint").textContent = "Tap = kudo (2 baar = double jump) · Neeche swipe = slide";

      let me, obs, coins, parts, speed, dist, coinCount, state, best, nextObs, nextCoin, t, newRecord;
      best = store.get("runner_best", 0);

      function reset() {
        me = { y: GROUND, vy: 0, jumps: 0, slide: 0, run: 0, onGround: true };
        obs = [];
        coins = [];
        parts = [];
        speed = 320;
        dist = 0;
        coinCount = 0;
        nextObs = 500;
        nextCoin = 300;
        t = 0;
        state = "ready";
      }
      const score = () => Math.floor(dist / 10) + coinCount * 5;

      // ---------- Spawning ----------
      function spawnObstacle() {
        const r = Math.random();
        const x = W + 40;
        if (r < 0.35) obs.push({ kind: "crate", x, w: 38, h: 38 });
        else if (r < 0.55) obs.push({ kind: "crate", x, w: 76, h: 38 });
        else if (r < 0.72) obs.push({ kind: "barrier", x, w: 26, h: 66 });
        else obs.push({ kind: "drone", x, w: 46, h: 22, y: GROUND - 58 - Math.random() * 6, bob: Math.random() * 6 });
        const gap = 260 + Math.random() * 260 + speed * 0.35;
        nextObs = gap;
      }

      function spawnCoins() {
        const n = 4 + Math.floor(Math.random() * 4);
        const arc = Math.random() < 0.5;
        for (let i = 0; i < n; i++) {
          const y = arc ? GROUND - 40 - Math.sin((i / (n - 1)) * Math.PI) * 90 : GROUND - 30;
          coins.push({ x: W + 40 + i * 34, y });
        }
        nextCoin = 400 + Math.random() * 500;
      }

      // ---------- Actions ----------
      function jump() {
        sound.unlock();
        if (state === "ready") { state = "play"; }
        if (state === "over") { reset(); state = "play"; return; }
        if (state !== "play") return;
        if (me.jumps < 2) {
          me.vy = me.jumps === 0 ? JUMP : JUMP2;
          me.jumps++;
          me.slide = 0;
          me.onGround = false;
          sound.beep(me.jumps === 1 ? 520 : 700, 0.08, "triangle", 0.05, 900);
          for (let i = 0; i < 6; i++) parts.push({ x: PX, y: me.y, vx: -100 - Math.random() * 100, vy: -Math.random() * 80, life: 0.35, c: "#e5e7eb" });
        }
      }
      function slide() {
        if (state !== "play") return;
        if (!me.onGround) { me.vy = Math.max(me.vy, 900); return; } // hawa mein = jaldi neeche
        me.slide = 0.6;
        sound.beep(300, 0.1, "sawtooth", 0.03, 150);
      }

      function hitbox() {
        if (me.slide > 0) return { x: PX - 18, y: me.y - 26, w: 40, h: 26 };
        return { x: PX - 13, y: me.y - 56, w: 26, h: 56 };
      }

      function update(dt) {
        for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
        parts = parts.filter((q) => q.life > 0);
        t += dt;
        if (state !== "play") return;

        speed = Math.min(760, 320 + dist * 0.02);
        const move = speed * dt;
        dist += move;

        me.vy += GRAV * dt;
        me.y += me.vy * dt;
        if (me.y >= GROUND) {
          if (!me.onGround) for (let i = 0; i < 5; i++) parts.push({ x: PX, y: GROUND, vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 60, life: 0.3, c: "#d6d3d1" });
          me.y = GROUND; me.vy = 0; me.jumps = 0; me.onGround = true;
        }
        me.slide = Math.max(0, me.slide - dt);
        me.run += dt * speed / 40;

        nextObs -= move;
        if (nextObs <= 0) spawnObstacle();
        nextCoin -= move;
        if (nextCoin <= 0) spawnCoins();

        const hb = hitbox();
        for (const o of obs) {
          o.x -= move;
          if (o.kind === "drone") o.bob += dt * 6;
          const oy = o.kind === "drone" ? o.y + Math.sin(o.bob) * 4 : GROUND - o.h;
          if (hb.x < o.x + o.w - 4 && hb.x + hb.w > o.x + 4 && hb.y < oy + o.h - 3 && hb.y + hb.h > oy + 3) return die();
        }
        obs = obs.filter((o) => o.x > -100);
        for (const c of coins) {
          c.x -= move;
          if (!c.got && Math.abs(c.x - PX) < 22 && c.y > hb.y - 12 && c.y < hb.y + hb.h + 12) {
            c.got = true;
            coinCount++;
            sound.beep(1200, 0.05, "sine", 0.05, 1600);
          }
        }
        coins = coins.filter((c) => !c.got && c.x > -20);
      }

      function die() {
        state = "over";
        sound.beep(160, 0.4, "sawtooth", 0.08, 60);
        if (navigator.vibrate) navigator.vibrate(150);
        for (let i = 0; i < 20; i++) parts.push({ x: PX, y: me.y - 30, vx: (Math.random() - 0.5) * 300, vy: (Math.random() - 0.8) * 300, life: 0.7, c: "#f97316" });
        newRecord = score() > best;
        if (newRecord) { best = score(); store.set("runner_best", best); }
      }

      // ---------- Draw ----------
      function rr(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function drawBg() {
        const g = ctx.createLinearGradient(0, 0, 0, GROUND);
        g.addColorStop(0, "#1e1b4b");
        g.addColorStop(0.55, "#be185d");
        g.addColorStop(1, "#fb923c");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#fde68a";
        ctx.beginPath(); ctx.arc(W * 0.72, GROUND - 120, 48, 0, Math.PI * 2); ctx.fill();
        // Pahaad (dheere), shehar (thoda tez)
        // Door ke pahaad
        let off = dist * 0.08;
        ctx.fillStyle = "#581c87";
        ctx.beginPath();
        ctx.moveTo(0, GROUND);
        for (let x = 0; x <= W; x += 8) ctx.lineTo(x, GROUND - (90 + Math.sin((x + off) / 140) * 30 + Math.sin((x + off) / 57) * 12));
        ctx.lineTo(W, GROUND);
        ctx.fill();
        // Shehar ki imaaratein (har imaarat ki unchaai uske number se tay, taaki chalte waqt na badle)
        off = dist * 0.25;
        const BW = 46, first = Math.floor(off / BW);
        ctx.fillStyle = "#3b0764";
        for (let i = 0; i <= W / BW + 1; i++) {
          const n = first + i;
          const h = 50 + ((n * 7919) % 5) * 18;
          const x = i * BW - (off % BW);
          ctx.fillRect(x, GROUND - h, BW - 4, h);
          ctx.fillStyle = "rgba(253,224,71,0.35)";
          for (let wy = GROUND - h + 8; wy < GROUND - 8; wy += 14) if ((n + wy) % 3) ctx.fillRect(x + 8, wy, 6, 6), ctx.fillRect(x + 24, wy, 6, 6);
          ctx.fillStyle = "#3b0764";
        }
        // Zameen
        ctx.fillStyle = "#44403c";
        ctx.fillRect(0, GROUND, W, H - GROUND);
        ctx.fillStyle = "#78716c";
        ctx.fillRect(0, GROUND, W, 6);
        ctx.fillStyle = "#57534e";
        for (let x = -(dist % 60); x < W; x += 60) ctx.fillRect(x, GROUND + 20, 30, 4);
      }

      function drawRunner() {
        const sliding = me.slide > 0 && state !== "over";
        ctx.save();
        ctx.translate(PX, me.y);
        if (state === "over") ctx.rotate(-1.2);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        if (sliding) {
          ctx.strokeStyle = "#1e3a8a"; ctx.lineWidth = 7;
          ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(18, -4); ctx.moveTo(-6, -8); ctx.lineTo(16, -12); ctx.stroke();
          ctx.fillStyle = "#ef4444"; rr(-22, -22, 26, 16, 6); ctx.fill();
          ctx.fillStyle = "#f5c08a"; ctx.beginPath(); ctx.arc(-26, -22, 9, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(-26, -26, 9, Math.PI, Math.PI * 2); ctx.fill();
          ctx.restore();
          return;
        }
        const a = me.onGround ? Math.sin(me.run) : 0.6;
        // legs
        ctx.strokeStyle = "#1e3a8a"; ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(Math.sin(a) * 14, -12); ctx.lineTo(Math.sin(a) * 16 - 2, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(-Math.sin(a) * 14, -12); ctx.lineTo(-Math.sin(a) * 16 - 4, 0); ctx.stroke();
        // body
        ctx.fillStyle = "#ef4444"; rr(-10, -48, 20, 28, 7); ctx.fill();
        // arms
        ctx.strokeStyle = "#f5c08a"; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(0, -42); ctx.lineTo(-Math.sin(a) * 14, -30); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -42); ctx.lineTo(Math.sin(a) * 14, -30); ctx.stroke();
        // head
        ctx.fillStyle = "#f5c08a"; ctx.beginPath(); ctx.arc(2, -58, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(1, -62, 10, Math.PI * 0.9, Math.PI * 2.05); ctx.fill();
        ctx.fillStyle = "#facc15"; ctx.fillRect(-9, -64, 20, 4);
        ctx.restore();
      }

      function drawObs(o) {
        if (o.kind === "crate") {
          const y = GROUND - o.h;
          for (let x = o.x; x < o.x + o.w - 1; x += 38) {
            ctx.fillStyle = "#b45309"; ctx.fillRect(x, y, 38, 38);
            ctx.strokeStyle = "#78350f"; ctx.lineWidth = 3; ctx.strokeRect(x + 1.5, y + 1.5, 35, 35);
            ctx.beginPath(); ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + 35, y + 35); ctx.moveTo(x + 35, y + 3); ctx.lineTo(x + 3, y + 35); ctx.stroke();
          }
        } else if (o.kind === "barrier") {
          const y = GROUND - o.h;
          for (let i = 0; i < o.h; i += 12) {
            ctx.fillStyle = (i / 12) % 2 ? "#fff" : "#ef4444";
            ctx.fillRect(o.x, y + i, o.w, 12);
          }
          ctx.fillStyle = "#fde047"; ctx.beginPath(); ctx.arc(o.x + o.w / 2, y - 4, 5, 0, Math.PI * 2); ctx.fill();
        } else {
          const y = o.y + Math.sin(o.bob) * 4;
          ctx.fillStyle = "#334155"; rr(o.x, y, o.w, o.h, 8); ctx.fill();
          ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.arc(o.x + 10, y + o.h / 2, 4, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 3;
          const sp = Math.sin(t * 60) * 12;
          ctx.beginPath(); ctx.moveTo(o.x + 6 - sp, y - 4); ctx.lineTo(o.x + 6 + sp, y - 4); ctx.moveTo(o.x + o.w - 6 - sp, y - 4); ctx.lineTo(o.x + o.w - 6 + sp, y - 4); ctx.stroke();
        }
      }

      function text(s, x, y, size, color, align = "center") {
        ctx.font = `800 ${size}px "Segoe UI", sans-serif`;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";
        ctx.lineWidth = size / 4;
        ctx.strokeStyle = "rgba(0,0,0,0.7)";
        ctx.strokeText(s, x, y);
        ctx.fillStyle = color;
        ctx.fillText(s, x, y);
      }

      function draw() {
        drawBg();
        for (const c of coins) {
          const sx = Math.abs(Math.sin(t * 5 + c.x / 30));
          ctx.fillStyle = "#facc15";
          ctx.beginPath(); ctx.ellipse(c.x, c.y, 9 * (0.3 + sx * 0.7), 9, 0, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#a16207"; ctx.lineWidth = 2; ctx.stroke();
        }
        obs.forEach(drawObs);
        drawRunner();
        for (const q of parts) {
          ctx.globalAlpha = Math.max(0, q.life * 2.5);
          ctx.fillStyle = q.c;
          ctx.fillRect(q.x, q.y, 4, 4);
        }
        ctx.globalAlpha = 1;
        text(`${score()}`, 16, 26, 26, "#fff", "left");
        text(`🪙 ${coinCount}   Best ${best}`, W - 16, 26, 16, "#fde68a", "right");

        if (state === "ready") {
          ctx.fillStyle = "rgba(15,16,32,0.45)";
          ctx.fillRect(0, 0, W, H);
          text("🏃 Endless Runner", W / 2, 120, 36, "#fff");
          text(IS_TOUCH ? "Tap = kudo · Neeche swipe = slide" : "Space = kudo · ↓ = slide", W / 2, 170, 18, "#fde68a");
          text("Game Zone by Shubham Goyal", W / 2, 205, 14, "#e5e7eb");
        }
        if (state === "over") {
          ctx.fillStyle = "rgba(15,16,32,0.6)";
          ctx.fillRect(0, 0, W, H);
          text(newRecord ? "🏆 Naya Record!" : "💥 Takkar ho gayi!", W / 2, 130, 34, "#fff");
          text(`Score ${score()} · 🪙 ${coinCount} · Best ${best}`, W / 2, 178, 20, "#fde68a");
          text(IS_TOUCH ? "Tap = dobara" : "Space = dobara", W / 2, 220, 16, "#cbd5e1");
        }
      }

      // ---------- Input ----------
      window.addEventListener("keydown", (e) => {
        if (["Space", "ArrowUp", "ArrowDown", "KeyW", "KeyS"].includes(e.code)) e.preventDefault();
        if (e.repeat) return;
        if (["Space", "ArrowUp", "KeyW", "Enter"].includes(e.code)) jump();
        if (["ArrowDown", "KeyS"].includes(e.code)) slide();
      });
      let sy = null, sx = null, swiped = false;
      canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        sx = e.clientX; sy = e.clientY; swiped = false;
        if (e.pointerType === "mouse") jump();
      });
      canvas.addEventListener("pointermove", (e) => {
        if (sy === null || swiped || e.pointerType === "mouse") return;
        if (e.clientY - sy > 30) { swiped = true; slide(); }
      });
      canvas.addEventListener("pointerup", (e) => {
        if (e.pointerType !== "mouse" && !swiped && sy !== null) jump();
        sy = null;
      });

      let last = performance.now();
      function loop(now) {
        const dt = Math.min((now - last) / 1000, 1 / 30);
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      document.addEventListener("visibilitychange", () => { last = performance.now(); });
      // Screen ke hisaab se chaudai (phone seedha ho ya laptop chauda)
      function resize() {
        ({ W, H } = fitCanvasFill(canvas, ctx, wrap, 440, 400, 820, 900));
        const shift = H - 70 - GROUND;
        GROUND = H - 70;
        // Khel ke beech size badla toh sab cheezein zameen ke saath khiskao
        if (me) { me.y += shift; obs.forEach((o) => o.y !== undefined && (o.y += shift)); coins.forEach((c) => (c.y += shift)); }
      }
      window.addEventListener("resize", resize);
      resize();
      reset();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
