<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1020">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../icons/favicon.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="../../js/pwa.js" defer></script>
  <title>Zombie Survival – Game Zone</title>
  <link rel="stylesheet" href="../../css/game.css">
  <style>canvas { cursor: crosshair; }</style>
</head>
<body class="fullscreen">
  <header class="topbar">
    <a class="btn small" href="../../index.html">← Home</a>
    <h1>🧟 Zombie Survival</h1>
    <span class="spacer"></span>
  </header>
  <main class="stage">
    <div class="canvas-wrap" id="wrap"><canvas id="game"></canvas></div>
    <div class="hint" id="hint">W A S D = chalo · Mouse = nishana · Click daba ke rakho = goli · P = pause</div>
  </main>

  <script src="../../js/common.js"></script>
  <script>
    (() => {
      const W = 720, H = 720;
      const P_SPEED = 190, P_R = 14;
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const wrap = document.getElementById("wrap");
      if (IS_TOUCH) document.getElementById("hint").textContent = "Left side = chalne ka joystick · Right side = nishana (chhodo toh auto-aim)";

      const TYPES = {
        walker: { hp: 3, speed: [55, 75], r: 15, color: "#65a30d", pts: 10 },
        runner: { hp: 1, speed: [130, 150], r: 12, color: "#a3e635", pts: 15 },
        brute: { hp: 14, speed: [36, 42], r: 24, color: "#7e22ce", pts: 50 },
      };

      let me, zombies, bullets, parts, decals, drops, wave, toSpawn, spawnT, breakT, score, best, state, shake, hurtT, kills, power, decor;
      best = store.get("zombie_best", 0);
      decor = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 6 + Math.random() * 16, k: Math.random() }));

      function reset() {
        me = { x: W / 2, y: H / 2, hp: 100, a: 0, cd: 0, flash: 0 };
        zombies = [];
        bullets = [];
        parts = [];
        decals = [];
        drops = [];
        wave = 0;
        score = 0;
        kills = 0;
        shake = 0;
        hurtT = 0;
        power = { rapid: 0, triple: 0 };
        state = "ready";
        nextWave();
      }

      function nextWave() {
        wave++;
        toSpawn = 6 + wave * 4;
        spawnT = 1;
        breakT = 2.5;
      }

      function spawnZombie() {
        const r = Math.random();
        const type = wave >= 3 && r < Math.min(0.15, 0.04 * wave) ? "brute" : wave >= 2 && r < 0.35 ? "runner" : "walker";
        const T = TYPES[type];
        const side = Math.floor(Math.random() * 4);
        const t = Math.random();
        const pos = [[t * W, -30], [W + 30, t * H], [t * W, H + 30], [-30, t * H]][side];
        zombies.push({
          type, x: pos[0], y: pos[1], r: T.r, hp: T.hp + Math.floor(wave / 4), max: T.hp + Math.floor(wave / 4),
          speed: T.speed[0] + Math.random() * (T.speed[1] - T.speed[0]) + wave * 2,
          hit: 0, wob: Math.random() * 6,
        });
      }

      // ---------- Shooting ----------
      function shoot() {
        if (me.cd > 0) return;
        me.cd = power.rapid > 0 ? 0.06 : 0.14;
        const spread = power.triple > 0 ? [-0.18, 0, 0.18] : [0];
        for (const s of spread) {
          const a = me.a + s + (Math.random() - 0.5) * 0.05;
          bullets.push({ x: me.x + Math.cos(a) * 22, y: me.y + Math.sin(a) * 22, vx: Math.cos(a) * 680, vy: Math.sin(a) * 680, life: 0.9 });
        }
        me.flash = 0.05;
        sound.beep(180 + Math.random() * 40, 0.05, "square", 0.035, 90);
      }

      function kill(z) {
        z.dead = true;
        kills++;
        score += TYPES[z.type].pts;
        decals.push({ x: z.x, y: z.y, r: z.r * 1.3, life: 12 });
        for (let i = 0; i < 12; i++) parts.push({ x: z.x, y: z.y, vx: (Math.random() - 0.5) * 260, vy: (Math.random() - 0.5) * 260, life: 0.5, c: "#4d7c0f", r: 3 });
        sound.beep(120, 0.12, "sawtooth", 0.04, 60);
        const r = Math.random();
        if (r < 0.06) drops.push({ x: z.x, y: z.y, kind: "health", life: 10 });
        else if (r < 0.1) drops.push({ x: z.x, y: z.y, kind: "rapid", life: 10 });
        else if (r < 0.13) drops.push({ x: z.x, y: z.y, kind: "triple", life: 10 });
      }

      // ---------- Update ----------
      function update(dt) {
        shake = Math.max(0, shake - dt);
        hurtT = Math.max(0, hurtT - dt);
        for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.9; q.vy *= 0.9; q.life -= dt; }
        parts = parts.filter((q) => q.life > 0);
        if (state !== "play") return;

        // Movement
        let mx = 0, my = 0;
        if (held.KeyA || held.ArrowLeft) mx -= 1;
        if (held.KeyD || held.ArrowRight) mx += 1;
        if (held.KeyW || held.ArrowUp) my -= 1;
        if (held.KeyS || held.ArrowDown) my += 1;
        if (sticks.move) { mx = sticks.move.dx; my = sticks.move.dy; }
        const len = Math.hypot(mx, my);
        if (len > 1) { mx /= len; my /= len; }
        me.x = Math.max(P_R, Math.min(W - P_R, me.x + mx * P_SPEED * dt));
        me.y = Math.max(P_R, Math.min(H - P_R, me.y + my * P_SPEED * dt));

        // Aim + fire
        me.cd = Math.max(0, me.cd - dt);
        me.flash = Math.max(0, me.flash - dt);
        power.rapid = Math.max(0, power.rapid - dt);
        power.triple = Math.max(0, power.triple - dt);
        let firing = false;
        if (sticks.aim && Math.hypot(sticks.aim.dx, sticks.aim.dy) > 0.3) {
          me.a = Math.atan2(sticks.aim.dy, sticks.aim.dx);
          firing = true;
        } else if (IS_TOUCH) {
          // Auto-aim: sabse paas wala zombie
          let near = null, nd = 340;
          for (const z of zombies) { const d = Math.hypot(z.x - me.x, z.y - me.y); if (d < nd) { nd = d; near = z; } }
          if (near) { me.a = Math.atan2(near.y - me.y, near.x - me.x); firing = true; }
        } else {
          me.a = Math.atan2(mouse.y - me.y, mouse.x - me.x);
          firing = mouse.down;
        }
        if (firing) shoot();

        // Waves
        if (toSpawn > 0) {
          spawnT -= dt;
          if (spawnT <= 0) {
            spawnZombie();
            toSpawn--;
            spawnT = Math.max(0.22, 0.9 - wave * 0.06) * (0.6 + Math.random() * 0.8);
          }
        } else if (!zombies.length) {
          breakT -= dt;
          if (breakT <= 0) nextWave();
        }

        // Bullets
        for (const b of bullets) {
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.life -= dt;
          for (const z of zombies) {
            if (z.dead || (z.x - b.x) ** 2 + (z.y - b.y) ** 2 > (z.r + 3) ** 2) continue;
            b.life = 0;
            z.hp--;
            z.hit = 0.08;
            // Thoda peeche dhakelo
            z.x += b.vx * 0.012; z.y += b.vy * 0.012;
            for (let i = 0; i < 3; i++) parts.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 160, vy: (Math.random() - 0.5) * 160, life: 0.3, c: "#84cc16", r: 2 });
            if (z.hp <= 0) kill(z);
            break;
          }
        }
        bullets = bullets.filter((b) => b.life > 0 && b.x > -10 && b.x < W + 10 && b.y > -10 && b.y < H + 10);

        // Zombies
        for (const z of zombies) {
          z.hit = Math.max(0, z.hit - dt);
          z.wob += dt * 8;
          const dx = me.x - z.x, dy = me.y - z.y, d = Math.hypot(dx, dy) || 1;
          z.x += (dx / d) * z.speed * dt;
          z.y += (dy / d) * z.speed * dt;
          if (d < z.r + P_R) {
            me.hp -= (z.type === "brute" ? 45 : 25) * dt;
            hurtT = 0.2;
            if (Math.random() < dt * 6) sound.beep(90, 0.06, "sawtooth", 0.04);
          }
        }
        // Zombies ek doosre mein na ghusein
        for (let i = 0; i < zombies.length; i++)
          for (let j = i + 1; j < zombies.length; j++) {
            const a = zombies[i], b = zombies[j];
            const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;
            if (d > 0 && d < m) {
              const push = (m - d) / 2;
              a.x -= (dx / d) * push; a.y -= (dy / d) * push;
              b.x += (dx / d) * push; b.y += (dy / d) * push;
            }
          }
        zombies = zombies.filter((z) => !z.dead);

        // Drops
        for (const dr of drops) {
          dr.life -= dt;
          if (Math.hypot(dr.x - me.x, dr.y - me.y) < 26) {
            dr.life = 0;
            if (dr.kind === "health") me.hp = Math.min(100, me.hp + 30);
            else power[dr.kind] = 7;
            sound.beep(660, 0.1, "sine", 0.07, 1200);
          }
        }
        drops = drops.filter((d) => d.life > 0);
        for (const d of decals) d.life -= dt;
        decals = decals.filter((d) => d.life > 0);

        if (me.hp <= 0) {
          me.hp = 0;
          state = "over";
          shake = 0.6;
          sound.beep(110, 0.8, "sawtooth", 0.08, 40);
          if (navigator.vibrate) navigator.vibrate(300);
          me.record = score > best;
          if (me.record) { best = score; store.set("zombie_best", best); }
        }
      }

      // ---------- Draw ----------
      function drawGround() {
        ctx.fillStyle = "#3f4a2e";
        ctx.fillRect(0, 0, W, H);
        for (const d of decor) {
          ctx.fillStyle = d.k < 0.5 ? "rgba(70,90,40,0.6)" : "rgba(50,60,30,0.6)";
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
        }
        for (const d of decals) {
          ctx.fillStyle = `rgba(60,90,20,${Math.min(0.5, d.life / 12)})`;
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
        }
      }

      function drawZombie(z) {
        const T = TYPES[z.type];
        const a = Math.atan2(me.y - z.y, me.x - z.x);
        ctx.save();
        ctx.translate(z.x, z.y);
        ctx.rotate(a);
        const sway = Math.sin(z.wob) * 3;
        ctx.fillStyle = z.hit > 0 ? "#fff" : T.color;
        ctx.fillRect(z.r * 0.3, -z.r * 0.8 + sway, z.r * 1.1, z.r * 0.35);
        ctx.fillRect(z.r * 0.3, z.r * 0.45 - sway, z.r * 1.1, z.r * 0.35);
        ctx.fillStyle = z.hit > 0 ? "#fff" : z.type === "brute" ? "#581c87" : "#3f6212";
        ctx.beginPath(); ctx.arc(0, 0, z.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = z.hit > 0 ? "#fff" : T.color;
        ctx.beginPath(); ctx.arc(z.r * 0.15, 0, z.r * 0.72, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ef4444";
        ctx.beginPath(); ctx.arc(z.r * 0.5, -z.r * 0.28, z.r * 0.14, 0, Math.PI * 2); ctx.arc(z.r * 0.5, z.r * 0.28, z.r * 0.14, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        if (z.max > 3 && z.hp < z.max) {
          ctx.fillStyle = "rgba(0,0,0,0.5)";
          ctx.fillRect(z.x - z.r, z.y - z.r - 10, z.r * 2, 4);
          ctx.fillStyle = "#ef4444";
          ctx.fillRect(z.x - z.r, z.y - z.r - 10, z.r * 2 * (z.hp / z.max), 4);
        }
      }

      function drawMe() {
        ctx.save();
        ctx.translate(me.x, me.y);
        ctx.rotate(me.a);
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath(); ctx.arc(3, 3, P_R, 0, Math.PI * 2); ctx.fill();
        // gun
        ctx.fillStyle = "#1f2937";
        ctx.fillRect(6, -3, 22, 6);
        if (me.flash > 0) {
          ctx.fillStyle = "#fde047";
          ctx.beginPath(); ctx.moveTo(28, 0); ctx.lineTo(40, -7); ctx.lineTo(38, 0); ctx.lineTo(40, 7); ctx.fill();
        }
        // arms
        ctx.fillStyle = "#f5c08a";
        ctx.beginPath(); ctx.arc(10, -8, 4, 0, Math.PI * 2); ctx.arc(14, 6, 4, 0, Math.PI * 2); ctx.fill();
        // body + head
        ctx.fillStyle = "#2563eb";
        ctx.beginPath(); ctx.arc(0, 0, P_R, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#78350f";
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      const DROP_ICON = { health: ["❤️", "#ef4444"], rapid: ["⚡", "#facc15"], triple: ["🔱", "#38bdf8"] };

      function text(t, x, y, size, color, align = "center") {
        ctx.font = `800 ${size}px "Segoe UI", sans-serif`;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";
        ctx.lineWidth = size / 4;
        ctx.strokeStyle = "rgba(0,0,0,0.75)";
        ctx.strokeText(t, x, y);
        ctx.fillStyle = color;
        ctx.fillText(t, x, y);
      }

      function draw() {
        ctx.save();
        if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 20, (Math.random() - 0.5) * shake * 20);
        drawGround();
        for (const d of drops) {
          const [icon, col] = DROP_ICON[d.kind];
          const bob = Math.sin(performance.now() / 200) * 3;
          ctx.fillStyle = col + "55";
          ctx.beginPath(); ctx.arc(d.x, d.y + bob, 16, 0, Math.PI * 2); ctx.fill();
          if (d.life > 3 || Math.floor(d.life * 6) % 2) {
            ctx.font = "20px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(icon, d.x, d.y + bob);
          }
        }
        ctx.fillStyle = "#fde047";
        for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill(); }
        zombies.forEach(drawZombie);
        drawMe();
        for (const q of parts) {
          ctx.globalAlpha = Math.max(0, q.life * 2);
          ctx.fillStyle = q.c;
          ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.restore();

        if (hurtT > 0) {
          const g = ctx.createRadialGradient(W / 2, H / 2, W * 0.3, W / 2, H / 2, W * 0.7);
          g.addColorStop(0, "rgba(255,0,0,0)");
          g.addColorStop(1, `rgba(255,0,0,${hurtT * 2})`);
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
        }

        // HUD
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(10, 10, 220, 20);
        ctx.fillStyle = me.hp > 50 ? "#22c55e" : me.hp > 25 ? "#f59e0b" : "#ef4444";
        ctx.fillRect(12, 12, 216 * (me.hp / 100), 16);
        text(`❤ ${Math.ceil(me.hp)}`, 120, 21, 13, "#fff");
        text(`Score ${score}`, W - 14, 22, 20, "#fff", "right");
        text(`Wave ${wave} · 🧟 ${zombies.length + toSpawn}`, W - 14, 48, 15, "#fde68a", "right");
        let px = 14;
        if (power.rapid > 0) { text(`⚡ ${power.rapid.toFixed(0)}s`, px, 50, 15, "#facc15", "left"); px += 70; }
        if (power.triple > 0) text(`🔱 ${power.triple.toFixed(0)}s`, px, 50, 15, "#38bdf8", "left");

        if (state === "play" && toSpawn === 0 && !zombies.length) text(`✅ Wave ${wave} saaf! Agli wave aa rahi hai...`, W / 2, H / 2 - 120, 24, "#a3e635");
        else if (state === "play" && toSpawn === 6 + wave * 4 && spawnT > 0.3) text(`🧟 Wave ${wave}`, W / 2, H / 2 - 120, 40, "#fff");

        drawSticks();

        if (state === "ready") {
          ctx.fillStyle = "rgba(15,16,32,0.6)";
          ctx.fillRect(0, 0, W, H);
          text("🧟 Zombie Survival", W / 2, H / 2 - 70, 42, "#a3e635");
          text("Jitni waves bacha sako, bachao!", W / 2, H / 2 - 20, 20, "#fff");
          text("❤️ = health   ⚡ = tez goli   🔱 = teen goli", W / 2, H / 2 + 20, 16, "#fde68a");
          text(IS_TOUCH ? "Tap karke shuru karo" : "Click karke shuru karo", W / 2, H / 2 + 70, 20, "#cbd5e1");
        }
        if (state === "paused") {
          ctx.fillStyle = "rgba(15,16,32,0.6)";
          ctx.fillRect(0, 0, W, H);
          text("⏸ Paused", W / 2, H / 2, 40, "#fff");
          text(IS_TOUCH ? "Tap = resume" : "P = resume", W / 2, H / 2 + 44, 18, "#cbd5e1");
        }
        if (state === "over") {
          ctx.fillStyle = "rgba(40,0,0,0.65)";
          ctx.fillRect(0, 0, W, H);
          text(me.record ? "🏆 Naya Record!" : "💀 Zombies jeet gaye!", W / 2, H / 2 - 60, 38, "#fff");
          text(`Score: ${score}  ·  Wave ${wave}  ·  ${kills} kills`, W / 2, H / 2 - 10, 22, "#fde68a");
          text(`Best: ${best}`, W / 2, H / 2 + 26, 18, "#fff");
          text(IS_TOUCH ? "Tap = dobara" : "Click = dobara", W / 2, H / 2 + 74, 18, "#cbd5e1");
        }
      }

      // ---------- Input ----------
      const held = {};
      const mouse = { x: W / 2 + 100, y: H / 2, down: false };
      const sticks = { move: null, aim: null };
      const stickPointers = new Map();
      const STICK_R = 60;

      function drawSticks() {
        for (const s of [sticks.move, sticks.aim]) {
          if (!s) continue;
          ctx.strokeStyle = "rgba(255,255,255,0.4)";
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(s.ox, s.oy, STICK_R, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = "rgba(255,255,255,0.35)";
          ctx.beginPath(); ctx.arc(s.ox + s.dx * STICK_R, s.oy + s.dy * STICK_R, 24, 0, Math.PI * 2); ctx.fill();
        }
      }

      function begin() {
        sound.unlock();
        if (state === "ready") state = "play";
        else if (state === "paused") state = "play";
        else if (state === "over") { reset(); state = "play"; }
      }

      window.addEventListener("keydown", (e) => {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
        held[e.code] = true;
        if ((e.code === "KeyP" || e.code === "Escape") && !e.repeat) state = state === "play" ? "paused" : state === "paused" ? "play" : state;
        if ((e.code === "Space" || e.code === "Enter") && state !== "play" && state !== "paused" && !e.repeat) begin();
      });
      window.addEventListener("keyup", (e) => (held[e.code] = false));

      canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const p = canvasPoint(canvas, e, W, H);
        if (state !== "play") { begin(); return; }
        if (e.pointerType === "mouse") {
          mouse.down = true;
          Object.assign(mouse, p);
          return;
        }
        canvas.setPointerCapture(e.pointerId);
        const which = p.x < W / 2 ? "move" : "aim";
        if (sticks[which]) return;
        sticks[which] = { ox: p.x, oy: p.y, dx: 0, dy: 0 };
        stickPointers.set(e.pointerId, which);
      });
      canvas.addEventListener("pointermove", (e) => {
        const p = canvasPoint(canvas, e, W, H);
        if (e.pointerType === "mouse") { Object.assign(mouse, p); return; }
        const which = stickPointers.get(e.pointerId);
        if (!which) return;
        const s = sticks[which];
        let dx = (p.x - s.ox) / STICK_R, dy = (p.y - s.oy) / STICK_R;
        const l = Math.hypot(dx, dy);
        if (l > 1) { dx /= l; dy /= l; }
        s.dx = dx; s.dy = dy;
      });
      const up = (e) => {
        if (e.pointerType === "mouse") { mouse.down = false; return; }
        const which = stickPointers.get(e.pointerId);
        if (which) { sticks[which] = null; stickPointers.delete(e.pointerId); }
      };
      canvas.addEventListener("pointerup", up);
      canvas.addEventListener("pointercancel", up);
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());

      let last = performance.now();
      function loop(now) {
        const dt = Math.min((now - last) / 1000, 1 / 30);
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      document.addEventListener("visibilitychange", () => {
        last = performance.now();
        if (document.hidden && state === "play") state = "paused";
      });
      const resize = () => fitCanvas(canvas, ctx, wrap, W, H);
      window.addEventListener("resize", resize);
      resize();
      reset();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
