<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1020">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../icons/favicon.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="../../js/pwa.js" defer></script>
  <title>2048 – Game Zone</title>
  <link rel="stylesheet" href="../../css/game.css">
  <style>
    html, body { overscroll-behavior: none; }
    body { user-select: none; -webkit-user-select: none; }
    .board {
      --gap: clamp(8px, 2.5vw, 12px);
      position: relative;
      width: min(92vw, 440px);
      width: min(92vw, 440px, calc(100dvh - 300px));
      min-width: 260px;
      aspect-ratio: 1;
      background: #bbada0;
      border-radius: 12px;
      padding: var(--gap);
      touch-action: none;
    }
    .cells {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
      height: 100%;
    }
    .cells div { background: rgba(238, 228, 218, 0.35); border-radius: 8px; }
    .tile {
      position: absolute;
      left: var(--gap);
      top: var(--gap);
      width: calc((100% - 5 * var(--gap)) / 4);
      height: calc((100% - 5 * var(--gap)) / 4);
      transform: translate(calc(var(--c) * (100% + var(--gap))), calc(var(--r) * (100% + var(--gap))));
      transition: transform 0.11s ease-in-out;
      z-index: 2;
    }
    .tile .in {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: clamp(1.4rem, 8vw, 2.4rem);
      color: #776e65;
      background: #eee4da;
    }
    .tile.new .in { animation: appear 0.18s ease 0.08s backwards; }
    .tile.merged { z-index: 3; }
    .tile.merged .in { animation: bump 0.2s ease; }
    @keyframes appear { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes bump { 50% { transform: scale(1.18); } }
    .v2 .in { background: #eee4da; }
    .v4 .in { background: #ede0c8; }
    .v8 .in { background: #f2b179; color: #fff; }
    .v16 .in { background: #f59563; color: #fff; }
    .v32 .in { background: #f67c5f; color: #fff; }
    .v64 .in { background: #f65e3b; color: #fff; }
    .v128 .in { background: #edcf72; color: #fff; font-size: clamp(1.2rem, 7vw, 2rem); }
    .v256 .in { background: #edcc61; color: #fff; font-size: clamp(1.2rem, 7vw, 2rem); }
    .v512 .in { background: #edc850; color: #fff; font-size: clamp(1.2rem, 7vw, 2rem); }
    .v1024 .in { background: #edc53f; color: #fff; font-size: clamp(1rem, 5.5vw, 1.6rem); }
    .v2048 .in { background: #edc22e; color: #fff; font-size: clamp(1rem, 5.5vw, 1.6rem); box-shadow: 0 0 20px #edc22e; }
    .vbig .in { background: #3c3a32; color: #fff; font-size: clamp(0.9rem, 4.5vw, 1.4rem); }
    .hint { color: var(--muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="btn small" href="../../index.html">← Home</a>
    <h1>🧩 2048</h1>
    <span class="spacer"></span>
  </header>

  <main class="stage">
    <div class="panel scores">
      <div><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
    <div class="row">
      <button class="btn small" id="undoBtn">↶ Undo</button>
      <button class="btn small primary" id="newBtn">🔄 New Game</button>
    </div>
    <div class="board" id="board">
      <div class="cells">
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
      </div>
    </div>
    <div class="hint" id="hint">Arrow keys / WASD se tiles khiskao. Same number milao!</div>
  </main>

  <div class="modal" id="modal">
    <div class="panel">
      <h2 id="mTitle"></h2>
      <p id="mText"></p>
      <div class="row">
        <button class="btn" id="mContinue">Khelte raho</button>
        <button class="btn primary" id="mNew">Naya game</button>
      </div>
    </div>
  </div>

  <p class="credit">Game Zone by Shubham Goyal</p>

  <script src="../../js/common.js"></script>
  <script>
    (() => {
      const N = 4;
      const $ = (id) => document.getElementById(id);
      const boardEl = $("board");
      if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches)
        $("hint").textContent = "Swipe karke tiles khiskao. Same number milao!";

      let grid, tiles, score, best, nextId, history, won, keepPlaying;
      best = store.get("2048_best", 0);

      // grid[r][c] = tile object ya null. Tile: { id, v, r, c, el }
      function emptyGrid() {
        return Array.from({ length: N }, () => Array(N).fill(null));
      }

      function makeTile(v, r, c, isNew) {
        const el = document.createElement("div");
        el.className = "tile" + (isNew ? " new" : "");
        el.innerHTML = `<div class="in"></div>`;
        boardEl.appendChild(el);
        const t = { id: nextId++, v, r, c, el };
        paint(t);
        return t;
      }

      function paint(t) {
        t.el.style.setProperty("--r", t.r);
        t.el.style.setProperty("--c", t.c);
        t.el.firstChild.textContent = t.v;
        t.el.classList.remove(...[...t.el.classList].filter((k) => k[0] === "v"));
        t.el.classList.add(t.v > 2048 ? "vbig" : "v" + t.v);
      }

      function addRandom() {
        const free = [];
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) free.push([r, c]);
        if (!free.length) return;
        const [r, c] = free[Math.floor(Math.random() * free.length)];
        grid[r][c] = makeTile(Math.random() < 0.9 ? 2 : 4, r, c, true);
      }

      function snapshot() {
        return { cells: grid.map((row) => row.map((t) => (t ? t.v : 0))), score };
      }

      function restore(snap) {
        boardEl.querySelectorAll(".tile").forEach((e) => e.remove());
        grid = emptyGrid();
        snap.cells.forEach((row, r) => row.forEach((v, c) => { if (v) grid[r][c] = makeTile(v, r, c, false); }));
        score = snap.score;
        updateScore();
      }

      function newGame() {
        boardEl.querySelectorAll(".tile").forEach((e) => e.remove());
        grid = emptyGrid();
        score = 0;
        nextId = 1;
        history = [];
        won = false;
        keepPlaying = false;
        addRandom();
        addRandom();
        updateScore();
        $("modal").classList.remove("show");
      }

      function updateScore() {
        $("score").textContent = score;
        if (score > best) { best = score; store.set("2048_best", best); }
        $("best").textContent = best;
        $("undoBtn").disabled = !history.length;
      }

      function move(dir) {
        if ($("modal").classList.contains("show")) return;
        const before = snapshot();
        // dir: line ko kis taraf dabana hai
        const vec = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] }[dir];
        let moved = false;
        const merged = [];
        const removed = [];

        for (let i = 0; i < N; i++) {
          // Ek line ke cells, jis taraf dabana hai wahan se shuru karke
          const line = [];
          for (let j = 0; j < N; j++) {
            const k = vec[0] + vec[1] > 0 ? N - 1 - j : j;
            line.push(vec[0] === 0 ? [i, k] : [k, i]);
          }
          const items = line.map(([r, c]) => grid[r][c]).filter(Boolean);
          const out = [];
          for (const t of items) {
            const last = out[out.length - 1];
            if (last && !last.justMerged && last.v === t.v) {
              last.v *= 2;
              last.justMerged = true;
              score += last.v;
              t.mergeInto = last;
              removed.push(t);
            } else {
              out.push(t);
            }
          }
          line.forEach(([r, c]) => (grid[r][c] = null));
          out.forEach((t, idx) => {
            const [r, c] = line[idx];
            if (t.r !== r || t.c !== c || t.justMerged) moved = true;
            t.r = r; t.c = c;
            grid[r][c] = t;
            if (t.justMerged) merged.push(t);
          });
          removed.forEach((t) => { if (t.mergeInto) { t.r = t.mergeInto.r; t.c = t.mergeInto.c; } });
        }

        if (!moved) return;

        history.push(before);
        if (history.length > 20) history.shift();

        // Pehle sab tiles ko nayi jagah slide karo (merged value abhi purani dikhegi)
        const all = grid.flat().filter(Boolean);
        all.forEach((t) => {
          t.el.classList.remove("new", "merged");
          t.el.style.setProperty("--r", t.r);
          t.el.style.setProperty("--c", t.c);
        });
        removed.forEach((t) => {
          t.el.style.setProperty("--r", t.r);
          t.el.style.setProperty("--c", t.c);
          t.el.style.zIndex = 1;
        });

        setTimeout(() => {
          removed.forEach((t) => t.el.remove());
          merged.forEach((t) => {
            t.justMerged = false;
            paint(t);
            void t.el.offsetWidth;
            t.el.classList.add("merged");
          });
          addRandom();
          updateScore();
          checkEnd();
        }, 110);
      }

      function canMove() {
        for (let r = 0; r < N; r++)
          for (let c = 0; c < N; c++) {
            const t = grid[r][c];
            if (!t) return true;
            if (c < N - 1 && grid[r][c + 1] && grid[r][c + 1].v === t.v) return true;
            if (r < N - 1 && grid[r + 1][c] && grid[r + 1][c].v === t.v) return true;
          }
        return false;
      }

      function checkEnd() {
        const has2048 = grid.flat().some((t) => t && t.v >= 2048);
        if (has2048 && !won && !keepPlaying) {
          won = true;
          show("🏆 2048 ban gaya!", `Score: ${score}. Aage khelna hai?`, true);
        } else if (!canMove()) {
          show("😢 Game Over", `Score: ${score} · Best: ${best}`, false);
        }
      }

      function show(title, text, canContinue) {
        $("mTitle").textContent = title;
        $("mText").textContent = text;
        $("mContinue").style.display = canContinue ? "" : "none";
        $("modal").classList.add("show");
      }

      // ---------- Input ----------
      const KEYS = {
        ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
        ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
      };
      let busy = false;
      function tryMove(d) {
        if (busy) return;
        busy = true;
        move(d);
        setTimeout(() => (busy = false), 120);
      }
      window.addEventListener("keydown", (e) => {
        if (KEYS[e.code]) { e.preventDefault(); tryMove(KEYS[e.code]); }
        if ((e.ctrlKey || e.metaKey) && e.code === "KeyZ") { e.preventDefault(); undo(); }
      });

      let sx = null, sy = null;
      boardEl.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; });
      window.addEventListener("pointerup", (e) => {
        if (sx === null) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        sx = sy = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
        tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      });
      boardEl.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

      function undo() {
        if (!history.length || busy) return;
        restore(history.pop());
        won = won && grid.flat().some((t) => t && t.v >= 2048);
        $("modal").classList.remove("show");
        updateScore();
      }

      $("undoBtn").addEventListener("click", undo);
      $("newBtn").addEventListener("click", newGame);
      $("mNew").addEventListener("click", newGame);
      $("mContinue").addEventListener("click", () => {
        keepPlaying = true;
        $("modal").classList.remove("show");
      });

      newGame();
    })();
  </script>
</body>
</html>
