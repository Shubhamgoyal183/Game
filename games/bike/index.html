<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1020">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../icons/favicon.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="../../js/pwa.js" defer></script>
  <title>Bike Racing – Game Zone</title>
  <link rel="stylesheet" href="../../css/game.css">
  <style>
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { user-select: none; -webkit-user-select: none; height: 100vh; height: 100dvh; }
    main.stage { min-height: 0; padding: 0 10px 10px; gap: 8px; }
    #wrap {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      min-height: 0;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .pad {
      position: absolute;
      bottom: 14px;
      display: flex;
      gap: 12px;
    }
    .pad.left { left: 14px; }
    .pad.right { right: 14px; }
    .pad button {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 1.6rem;
      font-weight: 800;
      touch-action: none;
      backdrop-filter: blur(3px);
    }
    .pad button.brake { width: 84px; font-size: 0.9rem; border-radius: 18px; }
    .pad button.on { background: rgba(255, 204, 51, 0.7); color: #1a1a1a; }
    @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
    .hint { color: var(--muted); font-size: 0.8rem; text-align: center; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="btn small" href="../../index.html">← Home</a>
    <h1>🏍️ Bike Racing</h1>
    <span class="spacer"></span>
  </header>

  <main class="stage">
    <div id="wrap">
      <canvas id="game"></canvas>
      <div class="pad left">
        <button data-k="left" aria-label="Left">◀</button>
        <button data-k="right" aria-label="Right">▶</button>
      </div>
      <div class="pad right">
        <button data-k="brake" class="brake" aria-label="Brake">BRAKE</button>
      </div>
    </div>
    <div class="hint" id="hint">← → / A D = steer · ↓ / S = brake · Traffic overtake karo, time khatam hone se pehle checkpoint tak pahuncho!</div>
  </main>

  <script src="../../js/common.js"></script>
  <script>
    (() => {
      // ================= Settings =================
      const SEG = 200;            // ek road segment ki lambai
      const RUMBLE = 3;           // kitne segments ki ek red/white patti
      const ROAD_W = 2000;        // sadak ki aadhi chaudai
      const LANES = 3;
      const FOV = 100;
      const CAM_H = 1000;
      const DRAW = 260;           // kitni door tak sadak dikhegi
      const CAM_DEPTH = 1 / Math.tan((FOV / 2) * Math.PI / 180);
      const PLAYER_Z = CAM_H * CAM_DEPTH;
      const MAX_SPEED = SEG * 60;
      const ACCEL = MAX_SPEED / 5;
      const BRAKE = -MAX_SPEED;
      const DECEL = -MAX_SPEED / 5;
      const OFFROAD_DECEL = -MAX_SPEED / 2;
      const OFFROAD_LIMIT = MAX_SPEED / 4;
      const CENTRIFUGAL = 0.3;
      const PLAYER_W = 0.16;      // road ke hisaab se bike ki chaudai
      const CHECK_SEGS = 1000;    // har itne segments par checkpoint
      const START_TIME = 30, BONUS_TIME = 20;

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const wrap = document.getElementById("wrap");
      const isTouch = !window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      if (isTouch) document.getElementById("hint").textContent = "◀ ▶ se steer, BRAKE se dheere · Time khatam hone se pehle checkpoint tak pahuncho!";

      let W = 0, H = 0;
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = wrap.clientWidth;
        H = wrap.clientHeight;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // ================= Track =================
      const segments = [];
      const lastY = () => (segments.length ? segments[segments.length - 1].p2.y : 0);
      const easeIn = (a, b, p) => a + (b - a) * p * p;
      const easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5);
      const lerp = (a, b, p) => a + (b - a) * p;

      function addSegment(curve, y) {
        const n = segments.length;
        segments.push({
          index: n,
          p1: { y: lastY(), z: n * SEG },
          p2: { y, z: (n + 1) * SEG },
          curve, sprites: [], cars: [], clip: 0,
        });
      }

      function addRoad(enter, hold, leave, curve, height) {
        const startY = lastY(), endY = startY + height * SEG, total = enter + hold + leave;
        for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
        for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
        for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
      }

      function buildTrack() {
        addRoad(25, 25, 25, 0, 0);
        addRoad(50, 50, 50, 0, 40);
        addRoad(50, 50, 50, 4, 0);
        addRoad(50, 50, 50, -4, -40);
        addRoad(25, 50, 25, 0, 0);
        addRoad(50, 100, 50, -2, 60);
        addRoad(50, 50, 50, 6, 0);
        addRoad(25, 25, 25, 0, -50);
        addRoad(50, 50, 50, -6, 20);
        addRoad(100, 50, 100, 2, -40);
        addRoad(25, 25, 25, -4, 0);
        addRoad(25, 25, 25, 4, 0);
        addRoad(50, 100, 50, 0, 30);
        addRoad(50, 50, 50, -3, -30);
        addRoad(100, 100, 100, 3, 0);
        addRoad(100, 100, 100, 0, -lastY() / SEG); // wapas zameen ki height par, taaki track loop ho

        // Kinare ke ped, jhaadiyaan aur boards
        for (let i = 10; i < segments.length; i += 4 + Math.floor(Math.random() * 4)) {
          const side = Math.random() < 0.5 ? -1 : 1;
          const kind = Math.random() < 0.65 ? "tree" : "bush";
          segments[i].sprites.push({ kind, offset: side * (1.3 + Math.random() * 1.6) });
          if (Math.random() < 0.3) segments[i].sprites.push({ kind: "tree", offset: -side * (1.4 + Math.random() * 2) });
        }
        for (let i = 60; i < segments.length; i += 220) {
          segments[i].sprites.push({ kind: "sign", offset: -1.35 });
        }
      }
      buildTrack();
      const N = segments.length;
      const TRACK_LEN = N * SEG;
      const findSeg = (z) => segments[Math.floor(z / SEG) % N];
      const wrapZ = (z) => ((z % TRACK_LEN) + TRACK_LEN) % TRACK_LEN;

      // ================= Traffic =================
      const CAR_COLORS = ["#ef4444", "#3b82f6", "#22c55e", "#eab308", "#a855f7", "#f97316", "#e5e7eb", "#14b8a6"];
      let cars = [];
      function makeTraffic() {
        segments.forEach((s) => (s.cars = []));
        cars = [];
        for (let i = 0; i < 60; i++) {
          const r = Math.random();
          const kind = r < 0.15 ? "truck" : r < 0.35 ? "bike" : "car";
          const car = {
            kind,
            offset: [-0.66, 0, 0.66][Math.floor(Math.random() * 3)] + (Math.random() - 0.5) * 0.2,
            z: (30 + Math.random() * (N - 40)) * SEG,
            speed: MAX_SPEED * (kind === "truck" ? 0.2 + Math.random() * 0.1 : 0.25 + Math.random() * 0.3),
            color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)],
            w: kind === "truck" ? 0.42 : kind === "bike" ? 0.16 : 0.34,
          };
          cars.push(car);
          findSeg(car.z).cars.push(car);
        }
      }

      function updateCars(dt) {
        for (const car of cars) {
          const old = findSeg(car.z);
          car.z = wrapZ(car.z + car.speed * dt);
          const now = findSeg(car.z);
          if (old !== now) {
            old.cars.splice(old.cars.indexOf(car), 1);
            now.cars.push(car);
          }
        }
      }

      // ================= Game state =================
      let position, playerX, speed, steerInput, state, timeLeft, dist, nextCheck, checkFlash, crashT, bgOffset, time, best, topSpeed, newRecord;
      best = store.get("bike_best", 0);
      const input = { left: false, right: false, brake: false };

      function reset() {
        position = 0;
        playerX = 0;
        speed = 0;
        steerInput = 0;
        timeLeft = START_TIME;
        dist = 0;
        nextCheck = CHECK_SEGS * SEG;
        checkFlash = 0;
        crashT = 0;
        bgOffset = 0;
        time = 0;
        topSpeed = 0;
        newRecord = false;
        makeTraffic();
        state = "ready";
      }

      const meters = () => Math.floor(dist / 166);
      const kmh = (s) => Math.round((s / MAX_SPEED) * 260);

      function update(dt) {
        time += dt;
        checkFlash = Math.max(0, checkFlash - dt);
        crashT = Math.max(0, crashT - dt);
        if (state !== "play") return;

        updateCars(dt);
        const playerSeg = findSeg(position + PLAYER_Z);
        const sp = speed / MAX_SPEED;
        const steerRate = dt * 2.2 * Math.max(0.35, sp);

        steerInput = (input.right ? 1 : 0) - (input.left ? 1 : 0);
        playerX += steerInput * steerRate;
        playerX -= steerRate * sp * playerSeg.curve * CENTRIFUGAL; // mod par bike baahar khinchti hai

        if (input.brake) speed += BRAKE * dt;
        else if (timeLeft > 0) speed += ACCEL * dt;
        else speed += DECEL * dt;

        const offRoad = playerX < -1 || playerX > 1;
        if (offRoad && speed > OFFROAD_LIMIT) speed += OFFROAD_DECEL * dt;

        // Ped / board se takkar
        if (offRoad) {
          for (const s of playerSeg.sprites) {
            const sw = s.kind === "bush" ? 0.25 : 0.3;
            if (Math.abs(playerX - s.offset) < (PLAYER_W + sw) / 2) {
              speed = Math.min(speed, MAX_SPEED / 6);
              crashHit();
              playerX += playerX > s.offset ? 0.05 : -0.05;
              break;
            }
          }
        }

        // Traffic se takkar
        for (const car of playerSeg.cars) {
          if (speed > car.speed && Math.abs(playerX - car.offset) < (PLAYER_W + car.w) / 2) {
            speed = car.speed * 0.5;
            position = wrapZ(car.z - PLAYER_Z - 10);
            crashHit();
            break;
          }
        }

        playerX = Math.max(-2.4, Math.min(2.4, playerX));
        speed = Math.max(0, Math.min(MAX_SPEED, speed));
        topSpeed = Math.max(topSpeed, speed);
        position = wrapZ(position + speed * dt);
        dist += speed * dt;
        bgOffset += playerSeg.curve * sp * dt * 0.08;

        if (dist >= nextCheck) {
          nextCheck += CHECK_SEGS * SEG;
          timeLeft += BONUS_TIME;
          checkFlash = 2;
          beep(660, 0.12); setTimeout(() => beep(990, 0.18), 120);
        }

        if (timeLeft > 0) {
          timeLeft = Math.max(0, timeLeft - dt);
          if (timeLeft === 0) beep(160, 0.5, "sawtooth");
        } else if (speed === 0) {
          state = "over";
          const m = meters();
          newRecord = m > best;
          if (newRecord) { best = m; store.set("bike_best", best); }
        }
      }

      function crashHit() {
        if (crashT > 0.2) return;
        crashT = 0.6;
        beep(110, 0.25, "sawtooth");
        if (navigator.vibrate) navigator.vibrate(80);
      }

      // ================= Sound =================
      let ac = null, engine = null;
      function audio() {
        try {
          if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
          if (ac.state === "suspended") ac.resume();
        } catch { ac = null; }
        return ac;
      }
      function beep(freq, dur, type = "square") {
        const a = audio();
        if (!a) return;
        const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
        o.type = type;
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.07, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(a.destination);
        o.start(t);
        o.stop(t + dur);
      }
      function startEngine() {
        const a = audio();
        if (!a || engine) return;
        const o = a.createOscillator(), g = a.createGain();
        o.type = "sawtooth";
        o.frequency.value = 50;
        g.gain.value = 0.025;
        o.connect(g).connect(a.destination);
        o.start();
        engine = { o, g };
      }
      function updateEngine() {
        if (!engine) return;
        const sp = speed / MAX_SPEED;
        engine.o.frequency.value = 45 + sp * 140 + Math.sin(time * 40) * 3;
        engine.g.gain.value = state === "play" ? 0.015 + sp * 0.02 : 0;
      }

      // ================= Render =================
      function project(p, camX, camY, camZ) {
        const cx = -camX, cy = p.y - camY, cz = p.z - camZ;
        p.cz = cz;
        p.scale = CAM_DEPTH / cz;
        p.sx = Math.round(W / 2 + p.scale * cx * W / 2);
        p.sy = Math.round(H / 2 - p.scale * cy * H / 2);
        p.sw = Math.round(p.scale * ROAD_W * W / 2);
      }

      function poly(x1, y1, x2, y2, x3, y3, x4, y4, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y3);
        ctx.lineTo(x4, y4);
        ctx.closePath();
        ctx.fill();
      }

      function drawBackground() {
        const horizon = H / 2;
        const g = ctx.createLinearGradient(0, 0, 0, horizon);
        g.addColorStop(0, "#3d8fe0");
        g.addColorStop(1, "#bfe6ff");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        // Suraj
        ctx.fillStyle = "rgba(255,240,180,0.9)";
        ctx.beginPath();
        ctx.arc(W * 0.75 - bgOffset * W * 0.2, horizon * 0.35, Math.min(W, H) * 0.06, 0, Math.PI * 2);
        ctx.fill();

        // Pahaad (do layer, parallax)
        const layers = [
          { color: "#7a9cc6", amp: 0.16, speed: 0.5, f1: 2, f2: 5 },
          { color: "#4f7a5a", amp: 0.09, speed: 1, f1: 3, f2: 7 },
        ];
        for (const L of layers) {
          ctx.fillStyle = L.color;
          ctx.beginPath();
          ctx.moveTo(0, horizon + 2);
          for (let x = 0; x <= W; x += 8) {
            const u = x / W + bgOffset * L.speed;
            const h = (Math.sin(u * Math.PI * 2 * L.f1) * 0.5 + 0.6 + Math.sin(u * Math.PI * 2 * L.f2) * 0.25) * L.amp * H;
            ctx.lineTo(x, horizon - Math.max(4, h));
          }
          ctx.lineTo(W, horizon + 2);
          ctx.closePath();
          ctx.fill();
        }
        ctx.fillStyle = "#1e9e2e";
        ctx.fillRect(0, horizon, W, H - horizon);
      }

      function drawSegment(seg, n) {
        const { p1, p2 } = seg;
        const light = Math.floor(seg.index / RUMBLE) % 2 === 0;
        ctx.fillStyle = light ? "#22a832" : "#1c9a2a";
        ctx.fillRect(0, p2.sy, W, p1.sy - p2.sy + 1);

        const r1 = p1.sw / 6, r2 = p2.sw / 6;
        const rumble = light ? "#f2f2f2" : "#d62828";
        poly(p1.sx - p1.sw - r1, p1.sy, p1.sx - p1.sw, p1.sy, p2.sx - p2.sw, p2.sy, p2.sx - p2.sw - r2, p2.sy, rumble);
        poly(p1.sx + p1.sw + r1, p1.sy, p1.sx + p1.sw, p1.sy, p2.sx + p2.sw, p2.sy, p2.sx + p2.sw + r2, p2.sy, rumble);
        poly(p1.sx - p1.sw, p1.sy, p1.sx + p1.sw, p1.sy, p2.sx + p2.sw, p2.sy, p2.sx - p2.sw, p2.sy,
          light ? "#6b6b6b" : "#646464");

        if (light) {
          const l1 = p1.sw / 32, l2 = p2.sw / 32;
          const lw1 = (p1.sw * 2) / LANES, lw2 = (p2.sw * 2) / LANES;
          let lx1 = p1.sx - p1.sw + lw1, lx2 = p2.sx - p2.sw + lw2;
          for (let l = 1; l < LANES; l++, lx1 += lw1, lx2 += lw2) {
            poly(lx1 - l1 / 2, p1.sy, lx1 + l1 / 2, p1.sy, lx2 + l2 / 2, p2.sy, lx2 - l2 / 2, p2.sy, "#f5f5f5");
          }
        }

        // Door ki cheezein dhundhli (fog)
        const fog = Math.min(1, Math.pow(n / DRAW, 2) * 1.3);
        if (fog > 0.02) {
          ctx.fillStyle = `rgba(191,230,255,${fog})`;
          ctx.fillRect(0, p2.sy, W, p1.sy - p2.sy + 1);
        }
      }

      // --- Sprites (x = beech mein, y = zameen par) ---
      function drawTree(x, y, w) {
        const h = w * 1.6;
        ctx.fillStyle = "#6b4423";
        ctx.fillRect(x - w * 0.07, y - h * 0.35, w * 0.14, h * 0.35);
        ctx.fillStyle = "#1f7a2b";
        ctx.beginPath();
        ctx.moveTo(x, y - h);
        ctx.lineTo(x + w / 2, y - h * 0.3);
        ctx.lineTo(x - w / 2, y - h * 0.3);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#2a9338";
        ctx.beginPath();
        ctx.moveTo(x, y - h * 1.05);
        ctx.lineTo(x + w * 0.35, y - h * 0.6);
        ctx.lineTo(x - w * 0.35, y - h * 0.6);
        ctx.closePath();
        ctx.fill();
      }

      function drawBush(x, y, w) {
        ctx.fillStyle = "#2f8f3a";
        ctx.beginPath();
        ctx.ellipse(x, y - w * 0.25, w / 2, w * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawSign(x, y, w) {
        const h = w * 0.9;
        ctx.fillStyle = "#555";
        ctx.fillRect(x - w * 0.35, y - h, w * 0.05, h);
        ctx.fillRect(x + w * 0.3, y - h, w * 0.05, h);
        ctx.fillStyle = "#0f1020";
        ctx.fillRect(x - w / 2, y - h, w, h * 0.55);
        ctx.strokeStyle = "#ffcc33";
        ctx.lineWidth = Math.max(1, w * 0.03);
        ctx.strokeRect(x - w / 2, y - h, w, h * 0.55);
        if (w > 30) {
          ctx.fillStyle = "#ffcc33";
          ctx.font = `800 ${w * 0.14}px "Segoe UI", sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("GAME ZONE", x, y - h * 0.82);
          ctx.fillStyle = "#fff";
          ctx.font = `600 ${w * 0.08}px "Segoe UI", sans-serif`;
          ctx.fillText("by Shubham Goyal", x, y - h * 0.62);
        }
      }

      function drawCarRear(x, y, w, color, truck) {
        const h = truck ? w * 1.05 : w * 0.62;
        // shadow
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.fillRect(x - w * 0.52, y - h * 0.08, w * 1.04, h * 0.1);
        // wheels
        ctx.fillStyle = "#111";
        ctx.fillRect(x - w * 0.48, y - h * 0.2, w * 0.18, h * 0.2);
        ctx.fillRect(x + w * 0.3, y - h * 0.2, w * 0.18, h * 0.2);
        if (truck) {
          ctx.fillStyle = "#d4d4d8";
          ctx.fillRect(x - w / 2, y - h, w, h * 0.85);
          ctx.fillStyle = color;
          ctx.fillRect(x - w / 2, y - h * 0.22, w, h * 0.08);
          ctx.fillStyle = "#ff3b3b";
          ctx.fillRect(x - w * 0.46, y - h * 0.3, w * 0.1, h * 0.06);
          ctx.fillRect(x + w * 0.36, y - h * 0.3, w * 0.1, h * 0.06);
          return;
        }
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x - w / 2, y - h * 0.15);
        ctx.lineTo(x - w / 2, y - h * 0.55);
        ctx.lineTo(x - w * 0.36, y - h);
        ctx.lineTo(x + w * 0.36, y - h);
        ctx.lineTo(x + w / 2, y - h * 0.55);
        ctx.lineTo(x + w / 2, y - h * 0.15);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "rgba(20,30,50,0.85)";
        ctx.beginPath();
        ctx.moveTo(x - w * 0.38, y - h * 0.6);
        ctx.lineTo(x - w * 0.3, y - h * 0.92);
        ctx.lineTo(x + w * 0.3, y - h * 0.92);
        ctx.lineTo(x + w * 0.38, y - h * 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#ff3b3b";
        ctx.fillRect(x - w * 0.46, y - h * 0.45, w * 0.14, h * 0.1);
        ctx.fillRect(x + w * 0.32, y - h * 0.45, w * 0.14, h * 0.1);
        ctx.fillStyle = "#e5e7eb";
        ctx.fillRect(x - w * 0.12, y - h * 0.32, w * 0.24, h * 0.1);
      }

      // Peeche se dikhti bike + rider (traffic aur player dono ke liye)
      function drawBikeRear(x, y, w, color, lean = 0, helmet = "#fff") {
        const h = w * 2.1;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(lean);
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.ellipse(0, 0, w * 0.55, w * 0.12, 0, 0, Math.PI * 2);
        ctx.fill();
        // tyre
        ctx.fillStyle = "#111";
        ctx.fillRect(-w * 0.13, -h * 0.3, w * 0.26, h * 0.3);
        // body / seat
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(-w * 0.4, -h * 0.28);
        ctx.lineTo(w * 0.4, -h * 0.28);
        ctx.lineTo(w * 0.3, -h * 0.45);
        ctx.lineTo(-w * 0.3, -h * 0.45);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#ff3b3b";
        ctx.fillRect(-w * 0.12, -h * 0.34, w * 0.24, h * 0.04);
        // handlebar
        ctx.fillStyle = "#222";
        ctx.fillRect(-w * 0.55, -h * 0.62, w * 1.1, h * 0.035);
        // rider body
        ctx.fillStyle = "#1f2937";
        ctx.beginPath();
        ctx.moveTo(-w * 0.32, -h * 0.42);
        ctx.lineTo(w * 0.32, -h * 0.42);
        ctx.lineTo(w * 0.26, -h * 0.78);
        ctx.lineTo(-w * 0.26, -h * 0.78);
        ctx.closePath();
        ctx.fill();
        // arms
        ctx.strokeStyle = "#1f2937";
        ctx.lineWidth = w * 0.12;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-w * 0.24, -h * 0.72);
        ctx.lineTo(-w * 0.5, -h * 0.61);
        ctx.moveTo(w * 0.24, -h * 0.72);
        ctx.lineTo(w * 0.5, -h * 0.61);
        ctx.stroke();
        // helmet
        ctx.fillStyle = helmet;
        ctx.beginPath();
        ctx.arc(0, -h * 0.86, w * 0.24, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = color;
        ctx.fillRect(-w * 0.24, -h * 0.88, w * 0.48, w * 0.08);
        ctx.restore();
      }

      function withClip(clipY, y, fn) {
        if (y <= clipY) return fn();
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, clipY);
        ctx.clip();
        fn();
        ctx.restore();
      }

      function hudText(str, x, y, size, color = "#fff", align = "center") {
        ctx.font = `800 ${size}px "Segoe UI", system-ui, sans-serif`;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";
        ctx.lineWidth = Math.max(3, size / 5);
        ctx.strokeStyle = "rgba(0,0,0,0.65)";
        ctx.strokeText(str, x, y);
        ctx.fillStyle = color;
        ctx.fillText(str, x, y);
      }

      function render() {
        drawBackground();

        const baseSeg = findSeg(position);
        const basePct = (position % SEG) / SEG;
        const playerSeg = findSeg(position + PLAYER_Z);
        const playerPct = ((position + PLAYER_Z) % SEG) / SEG;
        const playerY = lerp(playerSeg.p1.y, playerSeg.p2.y, playerPct);

        let maxy = H, x = 0, dx = -(baseSeg.curve * basePct);
        const visible = [];
        for (let n = 0; n < DRAW; n++) {
          const seg = segments[(baseSeg.index + n) % N];
          const looped = seg.index < baseSeg.index;
          const camZ = position - (looped ? TRACK_LEN : 0);
          seg.clip = maxy;
          project(seg.p1, playerX * ROAD_W - x, playerY + CAM_H, camZ);
          project(seg.p2, playerX * ROAD_W - x - dx, playerY + CAM_H, camZ);
          x += dx;
          dx += seg.curve;
          visible.push(seg);
          if (seg.p1.cz <= CAM_DEPTH || seg.p2.sy >= seg.p1.sy || seg.p2.sy >= maxy) continue;
          drawSegment(seg, n);
          maxy = seg.p1.sy;
        }

        // Door se paas: ped, gaadiyaan, aur player
        for (let n = visible.length - 1; n > 0; n--) {
          const seg = visible[n];
          if (seg.p1.cz <= CAM_DEPTH) continue;
          for (const s of seg.sprites) {
            const sc = seg.p1.scale;
            const sx = seg.p1.sx + sc * s.offset * ROAD_W * W / 2;
            const size = sc * (s.kind === "tree" ? 900 : s.kind === "sign" ? 1400 : 700) * W / 2;
            if (size < 1 || sx < -size || sx > W + size) continue;
            withClip(seg.clip, seg.p1.sy, () => {
              if (s.kind === "tree") drawTree(sx, seg.p1.sy, size);
              else if (s.kind === "bush") drawBush(sx, seg.p1.sy, size);
              else drawSign(sx, seg.p1.sy, size);
            });
          }
          for (const car of seg.cars) {
            const pct = (car.z % SEG) / SEG;
            const sc = lerp(seg.p1.scale, seg.p2.scale, pct);
            const sx = lerp(seg.p1.sx, seg.p2.sx, pct) + sc * car.offset * ROAD_W * W / 2;
            const sy = lerp(seg.p1.sy, seg.p2.sy, pct);
            const size = sc * car.w * ROAD_W * W / 2;
            if (size < 1) continue;
            withClip(seg.clip, sy, () => {
              if (car.kind === "bike") drawBikeRear(sx, sy, size * 0.8, car.color, 0, "#facc15");
              else drawCarRear(sx, sy, size, car.color, car.kind === "truck");
            });
          }
          if (seg === playerSeg) drawPlayer(playerSeg);
        }
        if (visible.indexOf(playerSeg) <= 0) drawPlayer(playerSeg);

        drawHud();
      }

      function drawPlayer(seg) {
        const sp = speed / MAX_SPEED;
        const w = Math.min(W * 0.13, H * 0.16);
        const offRoad = playerX < -1 || playerX > 1;
        const bounce = state === "play" ? Math.sin(time * 35) * sp * (offRoad ? 4 : 1.2) : 0;
        const lean = steerInput * 0.28 * Math.max(0.3, sp) + (crashT > 0 ? Math.sin(time * 50) * 0.15 : 0);
        drawBikeRear(W / 2, H - 12 + bounce, w, "#ef4444", lean, "#ffcc33");
      }

      function drawHud() {
        const s = Math.min(W, H) / 18;
        const size = Math.max(14, Math.min(26, s));
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(0, 0, W, size * 2.4);
        hudText(`${kmh(speed)} km/h`, 14, size * 1.2, size, "#fff", "left");
        hudText(`${meters()} m`, W - 14, size * 1.2, size, "#fff", "right");
        const tl = Math.ceil(timeLeft);
        hudText(`⏱ ${tl}`, W / 2, size * 1.2, size * 1.3, tl <= 5 && state === "play" ? "#ff6b6b" : "#ffcc33");

        if (checkFlash > 0) hudText(`CHECKPOINT! +${BONUS_TIME}s`, W / 2, H * 0.32, size * 1.5, "#4ade80");
        if (crashT > 0.3) {
          ctx.fillStyle = `rgba(255,60,60,${(crashT - 0.3) * 0.5})`;
          ctx.fillRect(0, 0, W, H);
        }
        if (timeLeft === 0 && state === "play") hudText("⏰ TIME UP!", W / 2, H * 0.4, size * 2, "#ff6b6b");

        if (state === "ready") {
          ctx.fillStyle = "rgba(15,16,32,0.55)";
          ctx.fillRect(0, 0, W, H);
          hudText("🏍️ Bike Racing", W / 2, H * 0.32, size * 2);
          hudText(isTouch ? "Tap karke start karo" : "Space / Enter dabake start karo", W / 2, H * 0.47, size, "#ffcc33");
          hudText(`Best: ${best} m`, W / 2, H * 0.57, size * 0.9, "#a3a6d1");
        }
        if (state === "over") {
          ctx.fillStyle = "rgba(15,16,32,0.65)";
          ctx.fillRect(0, 0, W, H);
          hudText(newRecord ? "🏆 Naya Record!" : "🏁 Race khatam!", W / 2, H * 0.3, size * 1.8);
          hudText(`Distance: ${meters()} m`, W / 2, H * 0.43, size * 1.2, "#ffcc33");
          hudText(`Top speed: ${kmh(topSpeed)} km/h · Best: ${best} m`, W / 2, H * 0.52, size * 0.8, "#fff");
          hudText(isTouch ? "Tap = dobara khelo" : "Space = dobara khelo", W / 2, H * 0.63, size * 0.9, "#a3a6d1");
        }
      }

      // ================= Input =================
      function begin() {
        if (state === "ready") { state = "play"; startEngine(); }
        else if (state === "over") { reset(); state = "play"; startEngine(); }
      }

      const KEYS = {
        ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
        ArrowDown: "brake", KeyS: "brake",
      };
      window.addEventListener("keydown", (e) => {
        if (KEYS[e.code]) { e.preventDefault(); input[KEYS[e.code]] = true; }
        if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); if (!e.repeat) begin(); }
        if (e.code === "ArrowUp") e.preventDefault();
      });
      window.addEventListener("keyup", (e) => { if (KEYS[e.code]) input[KEYS[e.code]] = false; });

      document.querySelectorAll(".pad button").forEach((b) => {
        const k = b.dataset.k;
        const on = (e) => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); input[k] = true; b.classList.add("on"); begin(); };
        const off = () => { input[k] = false; b.classList.remove("on"); };
        b.addEventListener("pointerdown", on);
        b.addEventListener("pointerup", off);
        b.addEventListener("pointercancel", off);
        b.addEventListener("lostpointercapture", off);
      });
      canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); begin(); });

      // ================= Loop =================
      let last = performance.now();
      function loop(now) {
        const dt = Math.min((now - last) / 1000, 1 / 30);
        last = now;
        update(dt);
        updateEngine();
        render();
        requestAnimationFrame(loop);
      }
      document.addEventListener("visibilitychange", () => {
        last = performance.now();
        if (document.hidden) { input.left = input.right = input.brake = false; if (engine) engine.g.gain.value = 0; }
      });

      window.addEventListener("resize", resize);
      resize();
      reset();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
