<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1020">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../icons/favicon.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="../../js/pwa.js" defer></script>
  <title>Jigsaw Puzzle – Game Zone</title>
  <link rel="stylesheet" href="../../css/game.css">
  <style>
    #wrap canvas { width: 100%; height: 100%; border-radius: 12px; background: #1a1b35; }
    .info { display: flex; gap: 16px; font-weight: 700; color: var(--muted); font-size: 0.95rem; }
    .info b { color: var(--text); }
    #file { display: none; }
  </style>
</head>
<body class="fullscreen">
  <header class="topbar">
    <a class="btn small" href="../../index.html">← Home</a>
    <h1>🧩 Jigsaw Puzzle</h1>
    <span class="spacer"></span>
  </header>
  <main class="stage">
    <div class="row" id="levelRow">
      <button class="btn small" data-level="easy">12 tukde</button>
      <button class="btn small" data-level="medium">24 tukde</button>
      <button class="btn small" data-level="hard">48 tukde</button>
    </div>
    <div class="row">
      <button class="btn small" id="newImg">🖼 Nayi tasveer</button>
      <label class="btn small" for="file">📷 Apni photo</label>
      <input type="file" id="file" accept="image/*">
      <button class="btn small" id="ghostBtn">👁 Halki tasveer</button>
    </div>
    <div class="info"><span>⏱ <b id="time">0:00</b></span><span>🧩 <b id="placed">0/0</b></span><span id="best"></span></div>
    <div class="canvas-wrap" id="wrap"><canvas id="game"></canvas></div>
  </main>

  <script src="../../js/common.js"></script>
  <script>
    (() => {
      const IW = 800, IH = 600;
      const LEVELS = { easy: [4, 3], medium: [6, 4], hard: [8, 6] };
      const $ = (id) => document.getElementById(id);
      const canvas = $("game");
      const ctx = canvas.getContext("2d");
      const wrap = $("wrap");

      let level = store.get("jig_level", "easy");
      let ghost = store.get("jig_ghost", true);
      let img = document.createElement("canvas");
      img.width = IW; img.height = IH;
      let C, R, pieces, W, H, dpr, s, frame, pw, ph, pad, drag, t0, timer, done, themeIdx = Math.floor(Math.random() * 5), confetti = [];

      // ================= Tasveerein (code se banti hain) =================
      const rand = (a, b) => a + Math.random() * (b - a);
      const THEMES = [
        function mountains(g) {
          const sky = g.createLinearGradient(0, 0, 0, 380);
          sky.addColorStop(0, "#1e3a8a"); sky.addColorStop(0.5, "#f472b6"); sky.addColorStop(1, "#fdba74");
          g.fillStyle = sky; g.fillRect(0, 0, IW, IH);
          g.fillStyle = "#fef3c7"; g.beginPath(); g.arc(rand(250, 550), 300, 60, 0, Math.PI * 2); g.fill();
          const layers = ["#7c3aed", "#5b21b6", "#3b0764"];
          layers.forEach((c, i) => {
            g.fillStyle = c; g.beginPath(); g.moveTo(0, 380);
            for (let x = 0; x <= IW; x += 40) g.lineTo(x, 380 - Math.abs(Math.sin(x / (90 + i * 30) + i * 2)) * (160 - i * 40) - rand(0, 20));
            g.lineTo(IW, 380); g.fill();
          });
          const lake = g.createLinearGradient(0, 380, 0, IH);
          lake.addColorStop(0, "#fb923c"); lake.addColorStop(1, "#1e3a8a");
          g.fillStyle = lake; g.fillRect(0, 380, IW, IH - 380);
          g.fillStyle = "rgba(255,255,255,0.35)";
          for (let i = 0; i < 30; i++) g.fillRect(rand(0, IW), rand(390, IH), rand(20, 80), 2);
          g.fillStyle = "#052e16";
          for (let i = 0; i < 9; i++) {
            const x = i < 4 ? rand(0, 180) : rand(620, IW), h = rand(80, 160), y = rand(420, 520);
            g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + h * 0.25, y); g.lineTo(x - h * 0.25, y); g.fill();
          }
        },
        function city(g) {
          const sky = g.createLinearGradient(0, 0, 0, IH);
          sky.addColorStop(0, "#020617"); sky.addColorStop(1, "#312e81");
          g.fillStyle = sky; g.fillRect(0, 0, IW, IH);
          g.fillStyle = "#fff";
          for (let i = 0; i < 120; i++) g.fillRect(rand(0, IW), rand(0, 300), rand(1, 2.5), rand(1, 2.5));
          g.fillStyle = "#fef9c3"; g.beginPath(); g.arc(rand(500, 720), 110, 50, 0, Math.PI * 2); g.fill();
          g.fillStyle = "#312e81"; g.beginPath(); g.arc(rand(520, 700), 95, 45, 0, Math.PI * 2); g.fill();
          for (let row = 0; row < 2; row++) {
            let x = -20;
            while (x < IW) {
              const w = rand(50, 110), h = rand(150, 380) - row * 80, y = IH - h;
              g.fillStyle = row ? "#1e1b4b" : "#0f172a";
              g.fillRect(x, y, w, h);
              for (let wy = y + 12; wy < IH - 10; wy += 20)
                for (let wx = x + 8; wx < x + w - 10; wx += 16)
                  if (Math.random() < 0.45) { g.fillStyle = ["#fde047", "#fdba74", "#a5f3fc"][Math.floor(rand(0, 3))]; g.fillRect(wx, wy, 8, 10); }
              x += w + rand(0, 10);
            }
          }
        },
        function ocean(g) {
          const sea = g.createLinearGradient(0, 0, 0, IH);
          sea.addColorStop(0, "#22d3ee"); sea.addColorStop(1, "#1e3a8a");
          g.fillStyle = sea; g.fillRect(0, 0, IW, IH);
          g.fillStyle = "rgba(255,255,255,0.08)";
          for (let i = 0; i < 6; i++) { const x = rand(0, IW); g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 60, 0); g.lineTo(x + 200, IH); g.lineTo(x + 100, IH); g.fill(); }
          g.fillStyle = "#fcd34d"; g.fillRect(0, IH - 60, IW, 60);
          for (let i = 0; i < 14; i++) {
            const x = rand(0, IW), h = rand(80, 220);
            g.strokeStyle = ["#16a34a", "#15803d", "#65a30d"][i % 3]; g.lineWidth = 8; g.beginPath(); g.moveTo(x, IH - 50);
            for (let y = 0; y < h; y += 20) g.lineTo(x + Math.sin(y / 20 + i) * 12, IH - 50 - y);
            g.stroke();
          }
          for (let i = 0; i < 16; i++) {
            const x = rand(40, IW - 40), y = rand(60, IH - 120), sz = rand(18, 45), d = Math.random() < 0.5 ? 1 : -1;
            const c = ["#f97316", "#facc15", "#ec4899", "#a855f7", "#ef4444", "#fff"][i % 6];
            g.fillStyle = c;
            g.beginPath(); g.ellipse(x, y, sz, sz * 0.55, 0, 0, Math.PI * 2); g.fill();
            g.beginPath(); g.moveTo(x - d * sz * 0.8, y); g.lineTo(x - d * sz * 1.5, y - sz * 0.5); g.lineTo(x - d * sz * 1.5, y + sz * 0.5); g.fill();
            g.fillStyle = "#111"; g.beginPath(); g.arc(x + d * sz * 0.5, y - sz * 0.1, sz * 0.1, 0, Math.PI * 2); g.fill();
          }
          g.strokeStyle = "rgba(255,255,255,0.6)"; g.lineWidth = 2;
          for (let i = 0; i < 30; i++) { g.beginPath(); g.arc(rand(0, IW), rand(0, IH - 80), rand(3, 9), 0, Math.PI * 2); g.stroke(); }
        },
        function space(g) {
          g.fillStyle = "#030712"; g.fillRect(0, 0, IW, IH);
          const neb = g.createRadialGradient(rand(200, 600), rand(150, 450), 10, 400, 300, 450);
          neb.addColorStop(0, "rgba(168,85,247,0.6)"); neb.addColorStop(0.5, "rgba(59,130,246,0.25)"); neb.addColorStop(1, "rgba(0,0,0,0)");
          g.fillStyle = neb; g.fillRect(0, 0, IW, IH);
          for (let i = 0; i < 250; i++) { g.fillStyle = `rgba(255,255,255,${rand(0.3, 1)})`; g.fillRect(rand(0, IW), rand(0, IH), rand(1, 2.5), rand(1, 2.5)); }
          const planets = [["#f97316", "#fdba74"], ["#38bdf8", "#1d4ed8"], ["#a3e635", "#3f6212"], ["#f472b6", "#9d174d"]];
          for (let i = 0; i < 4; i++) {
            const x = rand(80, IW - 80), y = rand(80, IH - 80), r = rand(25, 90), [c1, c2] = planets[i];
            const pg = g.createRadialGradient(x - r / 3, y - r / 3, r / 6, x, y, r);
            pg.addColorStop(0, c1); pg.addColorStop(1, c2);
            g.fillStyle = pg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
            if (i === 0) { g.strokeStyle = "rgba(253,230,138,0.8)"; g.lineWidth = 6; g.beginPath(); g.ellipse(x, y, r * 1.7, r * 0.4, -0.3, 0, Math.PI * 2); g.stroke(); }
          }
          const rx = rand(150, 650), ry = rand(150, 450);
          g.save(); g.translate(rx, ry); g.rotate(-0.6);
          g.fillStyle = "#f97316"; g.beginPath(); g.moveTo(-10, 40); g.lineTo(0, 75); g.lineTo(10, 40); g.fill();
          g.fillStyle = "#e5e7eb"; g.beginPath(); g.ellipse(0, 0, 18, 45, 0, 0, Math.PI * 2); g.fill();
          g.fillStyle = "#ef4444"; g.beginPath(); g.moveTo(-18, 20); g.lineTo(-32, 45); g.lineTo(-12, 38); g.fill(); g.beginPath(); g.moveTo(18, 20); g.lineTo(32, 45); g.lineTo(12, 38); g.fill();
          g.fillStyle = "#38bdf8"; g.beginPath(); g.arc(0, -10, 8, 0, Math.PI * 2); g.fill();
          g.restore();
        },
        function garden(g) {
          const sky = g.createLinearGradient(0, 0, 0, 300);
          sky.addColorStop(0, "#38bdf8"); sky.addColorStop(1, "#e0f2fe");
          g.fillStyle = sky; g.fillRect(0, 0, IW, IH);
          g.fillStyle = "#fde047"; g.beginPath(); g.arc(rand(100, 700), 80, 45, 0, Math.PI * 2); g.fill();
          g.fillStyle = "#fff";
          for (let i = 0; i < 4; i++) { const x = rand(0, IW), y = rand(40, 160); g.beginPath(); g.arc(x, y, 25, 0, Math.PI * 2); g.arc(x + 30, y - 10, 30, 0, Math.PI * 2); g.arc(x + 60, y, 24, 0, Math.PI * 2); g.fill(); }
          g.fillStyle = "#86efac"; g.beginPath(); g.moveTo(0, 300); g.quadraticCurveTo(200, 230, 400, 290); g.quadraticCurveTo(600, 340, IW, 260); g.lineTo(IW, IH); g.lineTo(0, IH); g.fill();
          g.fillStyle = "#4ade80"; g.fillRect(0, 380, IW, IH - 380);
          for (let i = 0; i < 60; i++) {
            const x = rand(10, IW - 10), y = rand(320, IH - 10), sz = rand(8, 18) * (y / IH);
            g.strokeStyle = "#15803d"; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + sz * 2); g.stroke();
            g.fillStyle = ["#ef4444", "#f97316", "#facc15", "#ec4899", "#a855f7", "#fff"][i % 6];
            for (let k = 0; k < 5; k++) { const a = (k / 5) * Math.PI * 2; g.beginPath(); g.arc(x + Math.cos(a) * sz * 0.6, y + Math.sin(a) * sz * 0.6, sz * 0.5, 0, Math.PI * 2); g.fill(); }
            g.fillStyle = "#facc15"; g.beginPath(); g.arc(x, y, sz * 0.35, 0, Math.PI * 2); g.fill();
          }
          for (let i = 0; i < 4; i++) {
            const x = rand(80, IW - 80), y = rand(180, 340), c = ["#f472b6", "#60a5fa", "#fbbf24", "#c084fc"][i];
            g.fillStyle = c;
            g.beginPath(); g.ellipse(x - 10, y - 6, 12, 9, -0.5, 0, Math.PI * 2); g.ellipse(x + 10, y - 6, 12, 9, 0.5, 0, Math.PI * 2); g.fill();
            g.beginPath(); g.ellipse(x - 8, y + 7, 8, 6, 0.4, 0, Math.PI * 2); g.ellipse(x + 8, y + 7, 8, 6, -0.4, 0, Math.PI * 2); g.fill();
            g.fillStyle = "#111"; g.fillRect(x - 1.5, y - 12, 3, 24);
          }
        },
      ];

      function makeThemeImage() {
        const g = img.getContext("2d");
        g.clearRect(0, 0, IW, IH);
        THEMES[themeIdx % THEMES.length](g);
      }

      // ================= Tukdon ka aakar =================
      function edge(g, x1, y1, x2, y2, sign, k) {
        if (!sign) { g.lineTo(x2, y2); return; }
        const len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len;
        const nx = uy * sign, ny = -ux * sign; // bahar ki taraf
        const Q = (a, b) => [x1 + ux * a + nx * b, y1 + uy * a + ny * b];
        const c = len / 2, kw = 0.32 * k, kh = 0.26 * k;
        g.lineTo(...Q(c - kw * 0.5, 0));
        g.bezierCurveTo(...Q(c - kw * 0.2, kh * 0.4), ...Q(c - kw * 0.95, kh), ...Q(c, kh));
        g.bezierCurveTo(...Q(c + kw * 0.95, kh), ...Q(c + kw * 0.2, kh * 0.4), ...Q(c + kw * 0.5, 0));
        g.lineTo(x2, y2);
      }

      function shape(g, p, ox, oy) {
        const k = Math.min(pw, ph);
        g.beginPath();
        g.moveTo(ox, oy);
        edge(g, ox, oy, ox + pw, oy, p.top, k);
        edge(g, ox + pw, oy, ox + pw, oy + ph, p.right, k);
        edge(g, ox + pw, oy + ph, ox, oy + ph, p.bottom, k);
        edge(g, ox, oy + ph, ox, oy, p.left, k);
        g.closePath();
      }

      function renderPiece(p) {
        const cw = pw + pad * 2, ch = ph + pad * 2;
        const cv = p.cv || document.createElement("canvas");
        cv.width = Math.ceil(cw * dpr);
        cv.height = Math.ceil(ch * dpr);
        const g = cv.getContext("2d", { willReadFrequently: true });
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.clearRect(0, 0, cw, ch);
        g.save();
        shape(g, p, pad, pad);
        g.clip();
        g.drawImage(img, pad - p.c * pw, pad - p.r * ph, IW * s, IH * s);
        g.restore();
        shape(g, p, pad, pad);
        g.lineWidth = 1.5;
        g.strokeStyle = "rgba(0,0,0,0.45)";
        g.stroke();
        g.save();
        g.translate(-0.8, -0.8);
        shape(g, p, pad, pad);
        g.strokeStyle = "rgba(255,255,255,0.35)";
        g.lineWidth = 1;
        g.stroke();
        g.restore();
        p.cv = cv;
      }

      // ================= Layout =================
      function layout(scatter) {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = wrap.clientWidth;
        H = wrap.clientHeight;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const landscape = W > H * 1.1;
        const area = landscape ? { x: 0, y: 0, w: W * 0.64, h: H } : { x: 0, y: 0, w: W, h: H * 0.56 };
        s = Math.min((area.w * 0.92) / IW, (area.h * 0.9) / IH);
        frame = { x: area.x + (area.w - IW * s) / 2, y: area.y + (area.h - IH * s) / 2 };
        pw = (IW / C) * s;
        ph = (IH / R) * s;
        pad = Math.min(pw, ph) * 0.3;
        const tray = landscape ? { x: W * 0.64, y: 0, w: W * 0.36, h: H } : { x: 0, y: H * 0.56, w: W, h: H * 0.44 };
        for (const p of pieces) {
          if (scatter && !p.locked) {
            const dx = tray.x + Math.random() * Math.max(1, tray.w - pw);
            const dy = tray.y + Math.random() * Math.max(1, tray.h - ph);
            p.ix = (dx - frame.x) / s;
            p.iy = (dy - frame.y) / s;
          }
          // Screen se bahar na jaaye
          let dx = frame.x + p.ix * s, dy = frame.y + p.iy * s;
          dx = Math.max(-pad / 2, Math.min(W - pw - pad / 2, dx));
          dy = Math.max(-pad / 2, Math.min(H - ph - pad / 2, dy));
          if (!p.locked) { p.ix = (dx - frame.x) / s; p.iy = (dy - frame.y) / s; }
          renderPiece(p);
        }
      }

      function newGame(newPicture) {
        [C, R] = LEVELS[level];
        if (newPicture === true) { themeIdx++; makeThemeImage(); }
        const hEdge = [], vEdge = [];
        for (let r = 0; r < R; r++) {
          hEdge[r] = []; vEdge[r] = [];
          for (let c = 0; c < C; c++) {
            hEdge[r][c] = Math.random() < 0.5 ? 1 : -1;
            vEdge[r][c] = Math.random() < 0.5 ? 1 : -1;
          }
        }
        pieces = [];
        for (let r = 0; r < R; r++)
          for (let c = 0; c < C; c++)
            pieces.push({
              r, c, locked: false, ix: 0, iy: 0,
              top: r === 0 ? 0 : -hEdge[r - 1][c],
              bottom: r === R - 1 ? 0 : hEdge[r][c],
              left: c === 0 ? 0 : -vEdge[r][c - 1],
              right: c === C - 1 ? 0 : vEdge[r][c],
            });
        pieces.sort(() => Math.random() - 0.5);
        done = false;
        confetti = [];
        drag = null;
        t0 = null;
        clearInterval(timer);
        $("time").textContent = "0:00";
        layout(true);
        updateInfo();
      }

      const fmt = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;

      function updateInfo() {
        $("placed").textContent = `${pieces.filter((p) => p.locked).length}/${pieces.length}`;
        const b = store.get("jig_best_" + level, null);
        $("best").innerHTML = b ? `🏆 <b>${fmt(b)}</b>` : "";
      }

      // ================= Draw =================
      function draw() {
        ctx.clearRect(0, 0, W, H);
        // Frame
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(frame.x - 6, frame.y - 6, IW * s + 12, IH * s + 12);
        ctx.fillStyle = "#2b2e5c";
        ctx.fillRect(frame.x, frame.y, IW * s, IH * s);
        if (ghost) {
          ctx.globalAlpha = 0.22;
          ctx.drawImage(img, frame.x, frame.y, IW * s, IH * s);
          ctx.globalAlpha = 1;
        }
        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.lineWidth = 1;
        for (let c = 1; c < C; c++) { ctx.beginPath(); ctx.moveTo(frame.x + c * pw, frame.y); ctx.lineTo(frame.x + c * pw, frame.y + IH * s); ctx.stroke(); }
        for (let r = 1; r < R; r++) { ctx.beginPath(); ctx.moveTo(frame.x, frame.y + r * ph); ctx.lineTo(frame.x + IW * s, frame.y + r * ph); ctx.stroke(); }

        // Pehle jode hue, phir baaki, aur jo pakda hai woh sabse upar
        for (const p of pieces) if (p.locked) drawPiece(p);
        for (const p of pieces) if (!p.locked && p !== drag?.p) drawPiece(p);
        if (drag) {
          ctx.save();
          ctx.shadowColor = "rgba(0,0,0,0.5)";
          ctx.shadowBlur = 16;
          ctx.shadowOffsetY = 6;
          drawPiece(drag.p);
          ctx.restore();
        }

        if (done) {
          for (const c of confetti) {
            c.x += c.vx; c.y += c.vy; c.vy += 0.15; c.a += 0.1;
            ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.a);
            ctx.fillStyle = c.col; ctx.fillRect(-4, -2, 8, 4);
            ctx.restore();
          }
          confetti = confetti.filter((c) => c.y < H + 20);
          ctx.font = '800 32px "Segoe UI", sans-serif';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.lineWidth = 8;
          ctx.strokeStyle = "rgba(0,0,0,0.7)";
          const msg = `🎉 Puzzle poora! ${$("time").textContent}`;
          ctx.strokeText(msg, W / 2, frame.y + (IH * s) / 2);
          ctx.fillStyle = "#fde047";
          ctx.fillText(msg, W / 2, frame.y + (IH * s) / 2);
        }
        requestAnimationFrame(draw);
      }

      function drawPiece(p) {
        ctx.drawImage(p.cv, frame.x + p.ix * s - pad, frame.y + p.iy * s - pad, pw + pad * 2, ph + pad * 2);
      }

      // ================= Drag & drop =================
      function pick(x, y) {
        for (let i = pieces.length - 1; i >= 0; i--) {
          const p = pieces[i];
          if (p.locked) continue;
          const lx = x - (frame.x + p.ix * s - pad), ly = y - (frame.y + p.iy * s - pad);
          if (lx < 0 || ly < 0 || lx > pw + pad * 2 || ly > ph + pad * 2) continue;
          const a = p.cv.getContext("2d").getImageData(Math.floor(lx * dpr), Math.floor(ly * dpr), 1, 1).data[3];
          if (a > 20) return p;
        }
        return null;
      }

      function pos(e) {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        sound.unlock();
        if (done) return;
        const { x, y } = pos(e);
        const p = pick(x, y);
        if (!p) return;
        canvas.setPointerCapture(e.pointerId);
        pieces.splice(pieces.indexOf(p), 1);
        pieces.push(p);
        drag = { p, ox: x - (frame.x + p.ix * s), oy: y - (frame.y + p.iy * s), id: e.pointerId };
        if (!t0) {
          t0 = Date.now();
          timer = setInterval(() => ($("time").textContent = fmt(Math.floor((Date.now() - t0) / 1000))), 500);
        }
        sound.beep(500, 0.03, "triangle", 0.03);
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        const { x, y } = pos(e);
        drag.p.ix = (x - drag.ox - frame.x) / s;
        drag.p.iy = (y - drag.oy - frame.y) / s;
      });
      const drop = (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        const p = drag.p;
        drag = null;
        const tx = p.c * (IW / C), ty = p.r * (IH / R);
        // Sahi jagah ke paas chhoda toh chipak jaata hai
        if (Math.abs(p.ix - tx) * s < 22 && Math.abs(p.iy - ty) * s < 22) {
          p.ix = tx; p.iy = ty;
          p.locked = true;
          sound.beep(880, 0.08, "sine", 0.07, 1200);
          if (navigator.vibrate) navigator.vibrate(20);
          updateInfo();
          if (pieces.every((q) => q.locked)) win();
        } else {
          sound.beep(300, 0.03, "triangle", 0.03);
        }
      };
      canvas.addEventListener("pointerup", drop);
      canvas.addEventListener("pointercancel", drop);

      function win() {
        done = true;
        clearInterval(timer);
        const secs = Math.floor((Date.now() - t0) / 1000);
        $("time").textContent = fmt(secs);
        const b = store.get("jig_best_" + level, null);
        if (!b || secs < b) store.set("jig_best_" + level, secs);
        updateInfo();
        for (let i = 0; i < 150; i++) confetti.push({ x: W / 2, y: H / 3, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 10 - 2, a: 0, col: `hsl(${Math.random() * 360},90%,60%)` });
        [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => sound.beep(f, 0.18, "sine", 0.08), i * 120));
      }

      // ================= Buttons =================
      document.querySelectorAll("#levelRow .btn").forEach((b) => b.addEventListener("click", () => {
        level = b.dataset.level;
        store.set("jig_level", level);
        document.querySelectorAll("#levelRow .btn").forEach((x) => x.classList.toggle("active", x === b));
        newGame(false);
      }));
      document.querySelectorAll("#levelRow .btn").forEach((x) => x.classList.toggle("active", x.dataset.level === level));
      $("newImg").addEventListener("click", () => newGame(true));
      const setGhostBtn = () => $("ghostBtn").classList.toggle("active", ghost);
      $("ghostBtn").addEventListener("click", () => { ghost = !ghost; store.set("jig_ghost", ghost); setGhostBtn(); });
      setGhostBtn();

      // Apni photo: beech se 4:3 mein kaat ke puzzle banao
      $("file").addEventListener("change", (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const url = URL.createObjectURL(f);
        const im = new Image();
        im.onload = () => {
          const g = img.getContext("2d");
          const scale = Math.max(IW / im.width, IH / im.height);
          const w = im.width * scale, h = im.height * scale;
          g.fillStyle = "#000";
          g.fillRect(0, 0, IW, IH);
          g.drawImage(im, (IW - w) / 2, (IH - h) / 2, w, h);
          URL.revokeObjectURL(url);
          newGame(false);
        };
        im.src = url;
        e.target.value = "";
      });

      let rt;
      window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => layout(false), 120); });

      makeThemeImage();
      newGame(false);
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
