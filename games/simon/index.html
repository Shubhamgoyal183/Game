<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1020">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../icons/favicon.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="../../js/pwa.js" defer></script>
  <title>Simon Says – Game Zone</title>
  <link rel="stylesheet" href="../../css/game.css">
  <style>
    body { user-select: none; -webkit-user-select: none; }
    .simon {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: min(86vw, 380px);
      width: min(86vw, 380px, calc(100dvh - 330px));
      min-width: 240px;
      aspect-ratio: 1;
      padding: 12px;
      background: #15162c;
      border-radius: 50%;
    }
    .pad {
      border: none;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.08s, transform 0.08s, filter 0.08s;
      touch-action: none;
    }
    .pad:nth-child(1) { background: #22c55e; border-radius: 100% 8px 8px 8px; }
    .pad:nth-child(2) { background: #ef4444; border-radius: 8px 100% 8px 8px; }
    .pad:nth-child(3) { background: #facc15; border-radius: 8px 8px 8px 100%; }
    .pad:nth-child(4) { background: #3b82f6; border-radius: 8px 8px 100% 8px; }
    .pad.lit { opacity: 1; filter: brightness(1.25) drop-shadow(0 0 18px currentColor); transform: scale(0.98); }
    .simon.locked .pad { cursor: default; }
    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #15162c;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: clamp(1.4rem, 7vw, 2.2rem);
      pointer-events: none;
      border: 6px solid #0f1020;
    }
    .hint { color: var(--muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="btn small" href="../../index.html">← Home</a>
    <h1>🔴 Simon Says 🔵</h1>
    <span class="spacer"></span>
  </header>

  <main class="stage">
    <div class="row" id="modeRow">
      <button class="btn small" data-mode="1p">👤 Solo</button>
      <button class="btn small" data-mode="2p">👥 2 Players</button>
    </div>
    <div class="panel scores" id="scorePanel"></div>
    <div class="status" id="status"></div>
    <div class="simon locked" id="simon">
      <button class="pad" data-i="0" aria-label="Green"></button>
      <button class="pad" data-i="1" aria-label="Red"></button>
      <button class="pad" data-i="2" aria-label="Yellow"></button>
      <button class="pad" data-i="3" aria-label="Blue"></button>
      <div class="center" id="center">▶</div>
    </div>
    <button class="btn primary" id="startBtn">▶ Start</button>
    <div class="hint" id="hint">Keyboard: Q W / A S (ya 1 2 3 4)</div>
  </main>

  <div class="modal" id="modal">
    <div class="panel">
      <h2 id="mTitle"></h2>
      <p id="mText"></p>
      <button class="btn primary" id="mBtn"></button>
    </div>
  </div>

  <p class="credit">Game Zone by Shubham Goyal</p>

  <script src="../../js/common.js"></script>
  <script>
    (() => {
      const TONES = [329.63, 261.63, 220, 164.81];
      const $ = (id) => document.getElementById(id);
      const pads = [...document.querySelectorAll(".pad")];
      const simon = $("simon");
      if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) $("hint").style.display = "none";

      let mode = store.get("simon_mode", "1p");
      let best = store.get("simon_best", 0);
      let seq = [], pos = 0, accepting = false, player = 1, alive = { 1: true, 2: true }, playing = false, token = 0;

      // ---------- Sound ----------
      let ac = null;
      function tone(freq, ms, type = "triangle") {
        try {
          if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
          if (ac.state === "suspended") ac.resume();
          const t = ac.currentTime;
          const o = ac.createOscillator(), g = ac.createGain();
          o.type = type;
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.2, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000);
          o.connect(g).connect(ac.destination);
          o.start(t);
          o.stop(t + ms / 1000);
        } catch { /* no audio */ }
      }

      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      function flash(i, ms) {
        pads[i].classList.add("lit");
        tone(TONES[i], ms);
        setTimeout(() => pads[i].classList.remove("lit"), ms);
      }

      function level() { return seq.length; }

      function render() {
        const panel = $("scorePanel");
        if (mode === "1p") {
          panel.innerHTML = `
            <div><div class="label">Level</div><div class="value">${level()}</div></div>
            <div><div class="label">Best</div><div class="value">${best}</div></div>`;
        } else {
          const st = (p) => (alive[p] ? (playing && player === p ? "▶ khel raha" : "✔") : "❌ out");
          panel.innerHTML = `
            <div class="p1"><div class="label">Player 1</div><div class="value" style="font-size:1.1rem">${st(1)}</div></div>
            <div><div class="label">Level</div><div class="value">${level()}</div></div>
            <div class="p2"><div class="label">Player 2</div><div class="value" style="font-size:1.1rem">${st(2)}</div></div>`;
        }
        $("center").textContent = playing ? level() : "▶";
      }

      function status(html) { $("status").innerHTML = html; }

      async function playSequence() {
        const my = token;
        accepting = false;
        simon.classList.add("locked");
        render();
        const prefix = mode === "2p" ? `<span class="p${player}">Player ${player}</span>: ` : "";
        status(prefix + `<span class="muted">Dhyan se dekho...</span>`);
        await wait(700);
        const speed = Math.max(220, 520 - level() * 20);
        for (const i of seq) {
          if (my !== token) return;
          flash(i, speed);
          await wait(speed + 120);
        }
        if (my !== token) return;
        pos = 0;
        accepting = true;
        simon.classList.remove("locked");
        status(prefix + "Ab aap dohraao!");
      }

      function press(i) {
        if (!accepting) return;
        flash(i, 220);
        if (i !== seq[pos]) return fail();
        pos++;
        if (pos === seq.length) {
          accepting = false;
          simon.classList.add("locked");
          setTimeout(nextTurn, 400);
        }
      }

      function fail() {
        accepting = false;
        simon.classList.add("locked");
        tone(110, 500, "sawtooth");
        if (navigator.vibrate) navigator.vibrate(150);
        const reached = level() - 1;

        if (mode === "1p") {
          playing = false;
          const isBest = reached > best;
          if (isBest) { best = reached; store.set("simon_best", best); }
          render();
          return modal(isBest ? "🏆 Naya Record!" : "❌ Galat button!", `Aap level ${reached} tak pahunche`, "Dobara khelo", start);
        }

        alive[player] = false;
        render();
        setTimeout(nextTurn, 600);
      }

      // 2 Player: dono same sequence baari-baari dohraate hain. Jo pehle galti kare, woh haara.
      function nextTurn() {
        if (mode === "1p") {
          seq.push(Math.floor(Math.random() * 4));
          return playSequence();
        }
        if (player === 1) {
          player = 2;
          if (!alive[2]) return nextTurn();
          return modal(`Player 2 ki baari`, `Level ${level()}`, "▶ Ready", () => playSequence());
        }
        // Round khatam (dono khel chuke)
        if (!alive[1] || !alive[2]) {
          playing = false;
          render();
          if (!alive[1] && !alive[2]) return modal("🤝 Barabar!", `Dono level ${level()} par out hue`, "Naya match", start);
          const winner = alive[1] ? 1 : 2;
          return modal(`🎉 Player ${winner} jeet gaya!`, `Level ${level()} par faisla hua`, "Naya match", start);
        }
        player = 1;
        seq.push(Math.floor(Math.random() * 4));
        modal(`Player 1 ki baari`, `Level ${level()}`, "▶ Ready", () => playSequence());
      }

      function modal(title, text, btn, action) {
        $("mTitle").textContent = title;
        $("mText").textContent = text;
        $("mBtn").textContent = btn;
        $("mBtn").onclick = () => { $("modal").classList.remove("show"); action(); };
        $("modal").classList.add("show");
      }

      function start() {
        token++;
        $("modal").classList.remove("show");
        seq = [Math.floor(Math.random() * 4)];
        player = 1;
        alive = { 1: true, 2: true };
        playing = true;
        $("startBtn").textContent = "🔄 Restart";
        playSequence();
      }

      pads.forEach((p) => p.addEventListener("pointerdown", (e) => { e.preventDefault(); press(+p.dataset.i); }));
      const KEYS = { KeyQ: 0, KeyW: 1, KeyA: 2, KeyS: 3, Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3 };
      window.addEventListener("keydown", (e) => {
        if (KEYS[e.code] !== undefined && !e.repeat) press(KEYS[e.code]);
      });
      $("startBtn").addEventListener("click", start);

      function setMode(m) {
        mode = m;
        store.set("simon_mode", m);
        document.querySelectorAll("#modeRow .btn").forEach((b) => b.classList.toggle("active", b.dataset.mode === m));
        token++;
        playing = false;
        accepting = false;
        seq = [];
        $("modal").classList.remove("show");
        simon.classList.add("locked");
        $("startBtn").textContent = "▶ Start";
        status(m === "1p"
          ? `<span class="muted">Computer ka pattern yaad rakho aur dohraao</span>`
          : `<span class="muted">Dono same pattern dohraayenge. Jo pehle galti kare, woh haara!</span>`);
        render();
      }

      document.querySelectorAll("#modeRow .btn").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
      setMode(mode);
    })();
  </script>
</body>
</html>
