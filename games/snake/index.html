<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1020">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../icons/favicon.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="../../js/pwa.js" defer></script>
  <title>Snake – Game Zone</title>
  <link rel="stylesheet" href="../../css/game.css">
  <style>
    html, body { overflow: hidden; overscroll-behavior: none; }
    body { user-select: none; -webkit-user-select: none; }
    main.stage { gap: 12px; padding-bottom: 12px; }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 700;
    }
    .hud .label { color: var(--muted); font-size: 0.8rem; font-weight: 600; }
    canvas {
      display: block;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      touch-action: none;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 62px);
      grid-template-rows: repeat(2, 54px);
      gap: 8px;
    }
    .dpad button {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: var(--text);
      font-size: 1.4rem;
      touch-action: none;
      cursor: pointer;
    }
    .dpad button:active { background: var(--accent); color: #1a1a1a; }
    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    /* Laptop (mouse) par d-pad ki zaroorat nahi */
    @media (hover: hover) and (pointer: fine) { .dpad { display: none; } }
    .hint { color: var(--muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="btn small" href="../../index.html">← Home</a>
    <h1>🐍 Snake</h1>
    <button class="btn small" id="pauseBtn">⏸ Pause</button>
  </header>

  <main class="stage">
    <div class="hud" id="hud">
      <div><span class="label">SCORE </span><span id="score">0</span></div>
      <div><span class="label">BEST </span><span id="best">0</span></div>
    </div>
    <canvas id="game"></canvas>
    <div class="dpad">
      <button class="up" data-dir="up" aria-label="Up">▲</button>
      <button class="left" data-dir="left" aria-label="Left">◀</button>
      <button class="down" data-dir="down" aria-label="Down">▼</button>
      <button class="right" data-dir="right" aria-label="Right">▶</button>
    </div>
    <div class="hint" id="hint">Arrow keys / WASD se chalao · Space = Pause</div>
  </main>

  <script src="../../js/common.js"></script>
  <script>
    (() => {
      const COLS = 20, ROWS = 20;
      const START_STEP = 140;  // ms per move
      const MIN_STEP = 65;

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const pauseBtn = document.getElementById("pauseBtn");
      const isTouch = !window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      if (isTouch) document.getElementById("hint").textContent = "Swipe karo ya buttons dabao";

      const DIRS = {
        up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
        left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
      };

      let size = 0; // canvas ka CSS size (px)
      function resize() {
        const reserved = isTouch ? 270 : 170; // header + hud + dpad/hint ki jagah
        size = Math.floor(Math.max(200, Math.min(window.innerWidth - 32, window.innerHeight - reserved, 560)));
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        canvas.style.width = canvas.style.height = size + "px";
        canvas.width = canvas.height = Math.floor(size * dpr);
        ctx.setTransform(canvas.width / COLS, 0, 0, canvas.height / ROWS, 0, 0);
        draw();
      }

      let snake, dir, queue, food, score, best, state, stepMs, acc, last;
      best = store.get("snake_best", 0);
      bestEl.textContent = best;

      function reset() {
        const cy = Math.floor(ROWS / 2);
        snake = [{ x: 6, y: cy }, { x: 5, y: cy }, { x: 4, y: cy }];
        dir = DIRS.right;
        queue = [];
        score = 0;
        stepMs = START_STEP;
        acc = 0;
        scoreEl.textContent = 0;
        placeFood();
        state = "ready";
        pauseBtn.textContent = "⏸ Pause";
      }

      function placeFood() {
        const free = [];
        for (let y = 0; y < ROWS; y++)
          for (let x = 0; x < COLS; x++)
            if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
        food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
      }

      function turn(name) {
        if (state === "over") reset();
        if (state === "paused") return;
        if (state === "ready") state = "play";
        const d = DIRS[name];
        // Queue ki aakhri direction se compare karo, taaki jaldi 2 key dabane par snake ulta na mude
        const ref = queue.length ? queue[queue.length - 1] : dir;
        if (d.x === -ref.x && d.y === -ref.y) return;
        if (d.x === ref.x && d.y === ref.y) return;
        if (queue.length < 3) queue.push(d);
      }

      function togglePause() {
        if (state === "play") { state = "paused"; pauseBtn.textContent = "▶ Resume"; }
        else if (state === "paused") { state = "play"; pauseBtn.textContent = "⏸ Pause"; last = performance.now(); }
        else if (state === "over" || state === "ready") { if (state === "over") reset(); state = "play"; }
        draw();
      }

      function step() {
        if (queue.length) dir = queue.shift();
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        const willEat = food && head.x === food.x && head.y === food.y;
        const body = willEat ? snake : snake.slice(0, -1); // poonchh aage badhegi, toh usse takrana allowed

        if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
            body.some((s) => s.x === head.x && s.y === head.y)) {
          state = "over";
          if (score > best) { best = score; store.set("snake_best", best); bestEl.textContent = best; }
          if (navigator.vibrate) navigator.vibrate(120);
          return;
        }

        snake.unshift(head);
        if (willEat) {
          score++;
          scoreEl.textContent = score;
          stepMs = Math.max(MIN_STEP, START_STEP - score * 3);
          placeFood();
          if (!food) state = "over"; // poora board bhar gaya — jeet!
        } else {
          snake.pop();
        }
      }

      function draw() {
        if (!snake) return;
        // Board (checkerboard)
        for (let y = 0; y < ROWS; y++)
          for (let x = 0; x < COLS; x++) {
            ctx.fillStyle = (x + y) % 2 ? "#a9d751" : "#a2d149";
            ctx.fillRect(x, y, 1, 1);
          }

        // Food (apple)
        if (food) {
          const r = 0.38 + Math.sin(performance.now() / 180) * 0.03;
          ctx.fillStyle = "#e7471d";
          ctx.beginPath();
          ctx.arc(food.x + 0.5, food.y + 0.55, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#4a752c";
          ctx.fillRect(food.x + 0.47, food.y + 0.08, 0.08, 0.18);
        }

        // Snake
        snake.forEach((s, i) => {
          const t = i / Math.max(1, snake.length - 1);
          ctx.fillStyle = `hsl(${220 - t * 20}, 75%, ${55 - t * 12}%)`;
          const pad = i === 0 ? 0.04 : 0.1;
          roundRect(s.x + pad, s.y + pad, 1 - pad * 2, 1 - pad * 2, 0.3);
          ctx.fill();
        });

        // Eyes
        const h = snake[0];
        const ex = dir.x, ey = dir.y;
        const px = -ey, py = ex; // perpendicular
        for (const side of [-1, 1]) {
          const cx = h.x + 0.5 + ex * 0.15 + px * 0.2 * side;
          const cy = h.y + 0.5 + ey * 0.15 + py * 0.2 * side;
          ctx.fillStyle = "#fff";
          ctx.beginPath(); ctx.arc(cx, cy, 0.15, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#111";
          ctx.beginPath(); ctx.arc(cx + ex * 0.05, cy + ey * 0.05, 0.07, 0, Math.PI * 2); ctx.fill();
        }

        if (state !== "play") overlay();
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function overlay() {
        ctx.fillStyle = "rgba(15,16,32,0.55)";
        ctx.fillRect(0, 0, COLS, ROWS);
        // Text ko asli pixels mein likho (bahut chhote font sizes kuch browsers mein dhundhle dikhte hain)
        ctx.save();
        const cell = canvas.width / COLS;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        let title, sub;
        if (state === "ready") {
          title = "🐍 Snake";
          sub = isTouch ? "Swipe ya button dabao" : "Arrow key dabao";
        } else if (state === "paused") {
          title = "Paused";
          sub = isTouch ? "Resume dabao" : "Space dabao";
        } else {
          title = food ? "Game Over" : "🏆 Aap jeet gaye!";
          sub = `Score: ${score} · ${isTouch ? "Tap" : "Space / Arrow"} = dobara`;
        }
        ctx.font = `800 ${1.6 * cell}px Segoe UI, system-ui, sans-serif`;
        ctx.fillText(title, (COLS / 2) * cell, (ROWS / 2 - 1.2) * cell);
        ctx.font = `600 ${0.8 * cell}px Segoe UI, system-ui, sans-serif`;
        ctx.fillStyle = "#ffcc33";
        ctx.fillText(sub, (COLS / 2) * cell, (ROWS / 2 + 0.8) * cell);
        ctx.restore();
      }

      function loop(now) {
        const dt = Math.min(now - last, 250);
        last = now;
        if (state === "play") {
          acc += dt;
          while (acc >= stepMs && state === "play") {
            acc -= stepMs;
            step();
          }
        }
        draw();
        requestAnimationFrame(loop);
      }

      // ---------- Input ----------
      const KEYS = {
        ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
        ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
      };
      window.addEventListener("keydown", (e) => {
        if (KEYS[e.code]) { e.preventDefault(); turn(KEYS[e.code]); }
        else if (e.code === "Space" || e.code === "KeyP") {
          e.preventDefault();
          if (!e.repeat) togglePause();
        }
      });

      document.querySelectorAll(".dpad button").forEach((b) =>
        b.addEventListener("pointerdown", (e) => { e.preventDefault(); turn(b.dataset.dir); }));

      pauseBtn.addEventListener("click", () => { togglePause(); pauseBtn.blur(); });

      // Swipe (poori screen par kaam karta hai)
      let sx = null, sy = null;
      document.addEventListener("touchstart", (e) => {
        if (e.target.closest(".dpad, .topbar")) return;
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      }, { passive: true });
      document.addEventListener("touchmove", (e) => {
        if (sx === null) return;
        e.preventDefault(); // page scroll na ho
        const dx = e.touches[0].clientX - sx;
        const dy = e.touches[0].clientY - sy;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
        sx = e.touches[0].clientX; // ek hi touch mein kai turns
        sy = e.touches[0].clientY;
      }, { passive: false });
      document.addEventListener("touchend", () => { sx = sy = null; });

      // Overlay par tap karke game over ke baad restart / pause ke baad resume
      canvas.addEventListener("click", () => {
        if (state === "over" || state === "paused") togglePause();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state === "play") togglePause();
      });

      window.addEventListener("resize", resize);
      reset();
      resize();
      last = performance.now();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
