<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1020">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../icons/favicon.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="../../js/pwa.js" defer></script>
  <title>Fruit Slice – Game Zone</title>
  <link rel="stylesheet" href="../../css/game.css">
</head>
<body class="fullscreen">
  <header class="topbar">
    <a class="btn small" href="../../index.html">← Home</a>
    <h1>🍉 Fruit Slice</h1>
    <span class="spacer"></span>
  </header>
  <main class="stage">
    <div class="canvas-wrap" id="wrap"><canvas id="game"></canvas></div>
    <div class="hint" id="hint">Mouse daba ke ghumao aur fruits kaato · 💣 bomb mat kaatna!</div>
  </main>

  <script src="../../js/common.js"></script>
  <script>
    (() => {
      const W = 480, H = 720, GRAV = 900;
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const wrap = document.getElementById("wrap");
      if (IS_TOUCH) document.getElementById("hint").textContent = "Ungli ghuma ke fruits kaato · 💣 bomb mat kaatna!";

      const FRUITS = [
        { name: "apple", r: 30, skin: "#dc2626", flesh: "#fef3c7", juice: "#fca5a5" },
        { name: "orange", r: 30, skin: "#f97316", flesh: "#fdba74", juice: "#fb923c" },
        { name: "melon", r: 44, skin: "#15803d", flesh: "#f43f5e", juice: "#fb7185" },
        { name: "lemon", r: 26, skin: "#facc15", flesh: "#fef9c3", juice: "#fde047" },
        { name: "kiwi", r: 26, skin: "#854d0e", flesh: "#84cc16", juice: "#bef264" },
        { name: "grape", r: 24, skin: "#7e22ce", flesh: "#d8b4fe", juice: "#c084fc" },
      ];

      let items, halves, parts, splats, trail, score, lives, state, best, waveT, combo, comboT, flash, popups, newRecord, level;
      best = store.get("fruit_best", 0);

      function reset() {
        items = []; halves = []; parts = []; splats = []; trail = []; popups = [];
        score = 0; lives = 3; waveT = 1; combo = 0; comboT = 0; flash = 0; level = 0;
        state = "ready";
      }

      function launch(isBomb) {
        const x = 60 + Math.random() * (W - 120);
        const f = isBomb ? null : FRUITS[Math.floor(Math.random() * FRUITS.length)];
        items.push({
          bomb: isBomb, f, x, y: H + 50,
          vx: (W / 2 - x) * (0.4 + Math.random() * 0.5),
          vy: -(820 + Math.random() * 230),
          rot: 0, vr: (Math.random() - 0.5) * 6,
          r: isBomb ? 30 : f.r,
        });
      }

      function wave() {
        level = Math.min(10, Math.floor(score / 25));
        const n = 1 + Math.floor(Math.random() * (2 + level / 2));
        const bombChance = Math.min(0.35, 0.12 + level * 0.025);
        for (let i = 0; i < n; i++) setTimeout(() => state === "play" && launch(Math.random() < bombChance && i > 0 || (n === 1 && Math.random() < bombChance * 0.5)), i * 180);
        waveT = Math.max(0.9, 2.2 - level * 0.12) + Math.random() * 0.6;
      }

      // ---------- Slice ----------
      function segDist(px, py, ax, ay, bx, by) {
        const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy || 1;
        const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l));
        return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
      }

      function cutCheck(a, b) {
        if (state !== "play") return;
        const speed = Math.hypot(b.x - a.x, b.y - a.y);
        if (speed < 6) return;
        for (const it of items) {
          if (it.cut || segDist(it.x, it.y, a.x, a.y, b.x, b.y) > it.r) continue;
          it.cut = true;
          if (it.bomb) return boom(it);
          const ang = Math.atan2(b.y - a.y, b.x - a.x);
          const nx = -Math.sin(ang), ny = Math.cos(ang);
          for (const side of [-1, 1]) {
            halves.push({ f: it.f, x: it.x, y: it.y, vx: it.vx * 0.5 + nx * side * 120, vy: it.vy * 0.3 + ny * side * 120 - 60, rot: ang + (side < 0 ? Math.PI : 0), vr: side * 4, life: 2 });
          }
          for (let i = 0; i < 14; i++) {
            const a2 = Math.random() * Math.PI * 2, s = 60 + Math.random() * 260;
            parts.push({ x: it.x, y: it.y, vx: Math.cos(a2) * s, vy: Math.sin(a2) * s, life: 0.6, c: it.f.juice, r: 2 + Math.random() * 4 });
          }
          splats.push({ x: it.x, y: it.y, r: it.r * 1.4, c: it.f.juice, life: 3 });
          score++;
          combo++;
          comboT = 0.25;
          sound.beep(700 + Math.random() * 300, 0.08, "triangle", 0.06, 300);
        }
      }

      function boom(it) {
        flash = 1;
        sound.beep(80, 0.8, "sawtooth", 0.1, 30);
        if (navigator.vibrate) navigator.vibrate(300);
        for (let i = 0; i < 40; i++) {
          const a = Math.random() * Math.PI * 2, s = 100 + Math.random() * 400;
          parts.push({ x: it.x, y: it.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: i % 2 ? "#f97316" : "#fde047", r: 3 + Math.random() * 4 });
        }
        gameOver();
      }

      function gameOver() {
        state = "over";
        newRecord = score > best;
        if (newRecord) { best = score; store.set("fruit_best", best); }
      }

      // ---------- Update ----------
      function update(dt) {
        flash = Math.max(0, flash - dt * 1.5);
        for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += GRAV * 0.6 * dt; q.life -= dt; }
        parts = parts.filter((q) => q.life > 0);
        for (const s of splats) s.life -= dt;
        splats = splats.filter((s) => s.life > 0);
        for (const h of halves) { h.x += h.vx * dt; h.y += h.vy * dt; h.vy += GRAV * dt; h.rot += h.vr * dt; h.life -= dt; }
        halves = halves.filter((h) => h.y < H + 80 && h.life > 0);
        for (const p of popups) { p.y -= 40 * dt; p.life -= dt; }
        popups = popups.filter((p) => p.life > 0);
        const now = performance.now();
        trail = trail.filter((p) => now - p.t < 140);

        if (comboT > 0) {
          comboT -= dt;
          if (comboT <= 0) {
            if (combo >= 3) {
              score += combo;
              popups.push({ x: W / 2, y: H * 0.3, text: `${combo} Fruit Combo! +${combo}`, life: 1.2 });
              sound.beep(1000, 0.2, "sine", 0.08, 1600);
            }
            combo = 0;
          }
        }
        if (state !== "play") return;

        waveT -= dt;
        if (waveT <= 0) wave();
        for (const it of items) {
          it.x += it.vx * dt; it.y += it.vy * dt; it.vy += GRAV * dt; it.rot += it.vr * dt;
          if (!it.cut && !it.bomb && it.vy > 0 && it.y > H + it.r) {
            it.cut = true;
            lives--;
            sound.beep(200, 0.2, "square", 0.05);
            popups.push({ x: Math.max(40, Math.min(W - 40, it.x)), y: H - 40, text: "❌", life: 0.8 });
            if (lives <= 0) gameOver();
          }
        }
        items = items.filter((it) => !it.cut && it.y < H + 120);
      }

      // ---------- Draw ----------
      function drawFruit(f, r) {
        const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
        g.addColorStop(0, "#ffffffaa");
        g.addColorStop(0.2, f.skin);
        g.addColorStop(1, f.skin);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        if (f.name === "melon") {
          ctx.strokeStyle = "#166534"; ctx.lineWidth = 4;
          for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.ellipse(i * r * 0.32, 0, r * 0.12, r * 0.95, 0, 0, Math.PI * 2); ctx.stroke(); }
        }
        if (f.name === "apple" || f.name === "orange" || f.name === "lemon") {
          ctx.fillStyle = "#3f6212";
          ctx.beginPath(); ctx.ellipse(r * 0.2, -r * 0.95, r * 0.25, r * 0.1, -0.5, 0, Math.PI * 2); ctx.fill();
        }
        if (f.name === "grape") {
          ctx.fillStyle = "#a855f7";
          for (const [x, y] of [[-8, -6], [8, -6], [0, 8]]) { ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill(); }
        }
      }

      function drawHalf(h) {
        const r = h.f.r;
        ctx.save();
        ctx.translate(h.x, h.y);
        ctx.rotate(h.rot);
        ctx.fillStyle = h.f.skin;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.closePath(); ctx.fill();
        ctx.fillStyle = h.f.flesh;
        ctx.beginPath(); ctx.arc(0, 0, r * 0.84, 0, Math.PI); ctx.closePath(); ctx.fill();
        if (h.f.name === "melon" || h.f.name === "kiwi") {
          ctx.fillStyle = "#111";
          for (let i = 0; i < 6; i++) { const a = 0.3 + i * 0.45; ctx.beginPath(); ctx.ellipse(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5, 2, 3.5, a, 0, Math.PI * 2); ctx.fill(); }
        }
        ctx.restore();
      }

      function drawBomb(it) {
        ctx.fillStyle = "#18181b";
        ctx.beginPath(); ctx.arc(0, 0, it.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#3f3f46";
        ctx.beginPath(); ctx.arc(-it.r * 0.35, -it.r * 0.35, it.r * 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#71717a"; ctx.fillRect(-6, -it.r - 8, 12, 10);
        ctx.strokeStyle = "#a16207"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, -it.r - 8); ctx.quadraticCurveTo(10, -it.r - 20, 4, -it.r - 26); ctx.stroke();
        ctx.fillStyle = Math.random() < 0.5 ? "#fde047" : "#f97316";
        ctx.beginPath(); ctx.arc(4, -it.r - 27, 4 + Math.random() * 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ef4444"; ctx.font = "800 18px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("✖", 0, 2);
      }

      function text(s, x, y, size, color) {
        ctx.font = `800 ${size}px "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";
        ctx.lineWidth = size / 4;
        ctx.strokeStyle = "rgba(0,0,0,0.7)";
        ctx.strokeText(s, x, y);
        ctx.fillStyle = color;
        ctx.fillText(s, x, y);
      }

      function draw() {
        // Lakdi ka background
        ctx.fillStyle = "#7c4a24";
        ctx.fillRect(0, 0, W, H);
        for (let x = 0; x < W; x += 80) {
          ctx.fillStyle = (x / 80) % 2 ? "#865229" : "#74431f";
          ctx.fillRect(x, 0, 78, H);
          ctx.fillStyle = "rgba(0,0,0,0.15)";
          for (let y = (x * 7) % 90; y < H; y += 90) ctx.fillRect(x + 20, y, 30, 2);
        }
        for (const s of splats) {
          ctx.globalAlpha = Math.min(0.5, s.life / 3);
          ctx.fillStyle = s.c;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        halves.forEach(drawHalf);
        for (const it of items) {
          ctx.save();
          ctx.translate(it.x, it.y);
          ctx.rotate(it.rot);
          it.bomb ? drawBomb(it) : drawFruit(it.f, it.r);
          ctx.restore();
        }
        for (const q of parts) {
          ctx.globalAlpha = Math.max(0, q.life * 1.6);
          ctx.fillStyle = q.c;
          ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Talwar ki chamak (blade trail)
        if (trail.length > 1) {
          ctx.lineCap = "round";
          for (let i = 1; i < trail.length; i++) {
            const k = i / trail.length;
            ctx.strokeStyle = `rgba(255,255,255,${k})`;
            ctx.lineWidth = 2 + k * 8;
            ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
          }
        }
        for (const p of popups) { ctx.globalAlpha = Math.min(1, p.life * 2); text(p.text, p.x, p.y, 26, "#fde047"); ctx.globalAlpha = 1; }

        text(`🍉 ${score}`, 70, 34, 30, "#fff");
        ctx.font = "26px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText("❌".repeat(3 - Math.max(0, lives)) + "🤍".repeat(Math.max(0, lives)), W - 14, 36);
        text(`Best ${best}`, 60, 70, 15, "#fde68a");

        if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
        if (state === "ready") {
          ctx.fillStyle = "rgba(0,0,0,0.45)";
          ctx.fillRect(0, 0, W, H);
          text("🍉 Fruit Slice", W / 2, H * 0.36, 44, "#fff");
          text(IS_TOUCH ? "Ungli ghuma ke kaato" : "Mouse daba ke ghumao", W / 2, H * 0.44, 20, "#fde68a");
          text("Game Zone by Shubham Goyal", W / 2, H * 0.49, 15, "#e5e7eb");
          text("Shuru karne ke liye tap / click", W / 2, H * 0.56, 18, "#cbd5e1");
        }
        if (state === "over") {
          ctx.fillStyle = "rgba(0,0,0,0.55)";
          ctx.fillRect(0, 0, W, H);
          text(newRecord ? "🏆 Naya Record!" : lives <= 0 ? "🍂 3 fruit chhoot gaye!" : "💥 Bomb kat gaya!", W / 2, H * 0.38, 36, "#fff");
          text(`Score ${score} · Best ${best}`, W / 2, H * 0.46, 24, "#fde68a");
          text(IS_TOUCH ? "Tap = dobara" : "Click = dobara", W / 2, H * 0.53, 18, "#cbd5e1");
        }
      }

      // ---------- Input ----------
      let down = false, lastPt = null, overAt = 0;
      canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        sound.unlock();
        if (state === "ready") { state = "play"; waveT = 0.4; return; }
        if (state === "over") { if (performance.now() - overAt > 700) reset(), (state = "play"), (waveT = 0.4); return; }
        canvas.setPointerCapture(e.pointerId);
        down = true;
        lastPt = canvasPoint(canvas, e, W, H);
        trail = [{ ...lastPt, t: performance.now() }];
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!down) return;
        const p = canvasPoint(canvas, e, W, H);
        trail.push({ ...p, t: performance.now() });
        cutCheck(lastPt, p);
        lastPt = p;
        if (state === "over") overAt = overAt || performance.now();
      });
      const up = () => { down = false; lastPt = null; };
      canvas.addEventListener("pointerup", up);
      canvas.addEventListener("pointercancel", up);
      window.addEventListener("keydown", (e) => { if ((e.code === "Space" || e.code === "Enter") && state !== "play") { e.preventDefault(); reset(); state = "play"; waveT = 0.4; } });

      let last = performance.now(), wasOver = false;
      function loop(now) {
        const dt = Math.min((now - last) / 1000, 1 / 30);
        last = now;
        update(dt);
        if (state === "over" && !wasOver) overAt = now;
        wasOver = state === "over";
        draw();
        requestAnimationFrame(loop);
      }
      document.addEventListener("visibilitychange", () => { last = performance.now(); });
      const resize = () => fitCanvas(canvas, ctx, wrap, W, H);
      window.addEventListener("resize", resize);
      resize();
      reset();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
